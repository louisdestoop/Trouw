<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7B1A50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Onze trouw">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>Trouwplanner Florence &amp; Louis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: één kolom (max 1080px). Kop met namen en aftelling, overzichtsstrook, dan vijf tabbladen. Palet: het kleurenpalet van Florence & Louis (plum, raspberry, blush, warm ivory). */
:root{
  --bg:#F3E9E1; --surface:#FFFAF6; --ink:#2B1320; --muted:#7A5E6B; --line:#E5D4CA;
  --plum:#7B1A50; --rasp:#B83970; --blush:#F1A9CB; --blush-soft:#F9E3EE;
  --ok:#2C6E4A; --ok-soft:#E1EFE6; --warn:#B0412A; --warn-soft:#F7E2DA; --gold:#8E6A1E; --gold-soft:#F3E8CF;
  --on-accent:#FFFAF6;
  --seat-ok:#2F855A; --seat-ok-ink:#FFFFFF; --seat-wait:#E0892B; --seat-wait-ink:#2B1320;
  --seat-free:#F6D6D2; --seat-free-ink:#A3302A; --seat-free-line:#E3A39B; --table:#EADBCF;
  --display:"Bodoni Moda", "Didot", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0E15; --surface:#25141E; --ink:#F3E9E1; --muted:#BFA3B0; --line:#3C2632;
    --plum:#F1A9CB; --rasp:#E788B0; --blush:#F1A9CB; --blush-soft:#3A1B2C;
    --ok:#7CC69A; --ok-soft:#183020; --warn:#EE9378; --warn-soft:#3B1E18; --gold:#DDB665; --gold-soft:#33291A;
    --on-accent:#1B0E15; color-scheme:dark;
    --seat-ok:#3E9B69; --seat-ok-ink:#F3FFF7; --seat-wait:#E39A45; --seat-wait-ink:#1B0E15;
    --seat-free:#4A2321; --seat-free-ink:#F2A79F; --seat-free-line:#7A3A35; --table:#3A2630;
  }
}
:root[data-theme="dark"]{
  --seat-ok:#3E9B69; --seat-ok-ink:#F3FFF7; --seat-wait:#E39A45; --seat-wait-ink:#1B0E15;
  --seat-free:#4A2321; --seat-free-ink:#F2A79F; --seat-free-line:#7A3A35; --table:#3A2630;
  --bg:#1B0E15; --surface:#25141E; --ink:#F3E9E1; --muted:#BFA3B0; --line:#3C2632;
  --plum:#F1A9CB; --rasp:#E788B0; --blush:#F1A9CB; --blush-soft:#3A1B2C;
  --ok:#7CC69A; --ok-soft:#183020; --warn:#EE9378; --warn-soft:#3B1E18; --gold:#DDB665; --gold-soft:#33291A;
  --on-accent:#1B0E15; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 64px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rasp);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rasp);font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,6.4vw,58px);line-height:1.04;display:flex;flex-wrap:wrap;align-items:baseline;gap:.22em;color:var(--plum)}
h1 .amp{font-style:italic;color:var(--rasp)}
.name-input{font-family:var(--display);font-size:inherit;line-height:inherit;color:var(--plum);border:none;border-bottom:1px dashed transparent;background:transparent;width:6.2em;max-width:100%;padding:0}
.name-input:hover,.name-input:focus{border-bottom-color:var(--rasp);outline:none}
.venue{margin:6px 0 0;color:var(--muted);font-size:14px}
.countdown{text-align:right}
.countdown .big{font-family:var(--display);font-size:clamp(42px,7vw,66px);line-height:1;font-variant-numeric:tabular-nums;color:var(--plum)}
.countdown .sub{color:var(--muted);font-size:13px}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .value small{font-size:14px;font-weight:500;color:var(--muted)}
.stat .foot{font-size:13px;color:var(--muted)}
.stat .foot b{color:var(--warn);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--rasp);border-radius:3px;transition:width .3s}
.bar.over span{background:var(--warn)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--plum);border-bottom-color:var(--rasp)}
.tabs .n{font-weight:500;font-size:12px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}

main{display:flex;flex-direction:column;gap:16px;min-height:200px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.panel-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;color:var(--plum)}
.meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.add{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--blush-soft);border-radius:var(--radius);padding:12px}
.add label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.add label.grow{flex:1 1 180px}
.add input,.add select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
.btn{border:none;border-radius:7px;padding:9px 16px;background:var(--plum);color:var(--on-accent);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:default}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-width:0;flex:1 1 200px;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.chip-btn[aria-pressed="true"]{background:var(--plum);color:var(--on-accent);border-color:var(--plum)}
.sep{width:1px;height:22px;background:var(--line)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.guests table{min-width:990px}.budget table{min-width:950px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:600;padding:10px 8px;border-top:1px solid var(--line);border-bottom:none;font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.c{text-align:center}
.cell{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:5px 6px;min-width:0}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--rasp);background:var(--bg);outline:none}
input.cell.num{text-align:right}
select.cell{cursor:pointer}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--rasp);cursor:pointer;vertical-align:middle}
.crd{display:flex;gap:4px;justify-content:center}
.crd label{position:relative;cursor:pointer}
.crd input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.crd span{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);transition:background .15s,color .15s}
.crd input:checked + span{background:var(--rasp);border-color:var(--rasp);color:var(--on-accent)}
.crd input:focus-visible + span{outline:2px solid var(--rasp);outline-offset:2px}
.crd input:disabled + span{opacity:.5;cursor:default}
select.via{width:auto;font-weight:600;color:var(--plum)}
.nr{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.w-money{width:120px}
select.status[data-v="ja"]{color:var(--ok);font-weight:600}
select.status[data-v="nee"]{color:var(--warn)}
select.status[data-v="open"]{color:var(--muted)}
tr.declined td{opacity:.6}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag.opt{background:var(--gold-soft);color:var(--gold)}
.tag.late{background:var(--warn-soft);color:var(--warn)}
.tag.soon{background:var(--gold-soft);color:var(--gold)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.quiet{color:var(--muted);font-weight:500;padding-inline:0}
.tag.urgent{background:var(--warn);color:var(--on-accent)}
.tag.hoog{background:var(--blush-soft);color:var(--rasp)}
.tag.middel{background:transparent;color:var(--muted);border:1px solid var(--line)}
.handle{border:none;background:transparent;color:var(--muted);cursor:grab;padding:6px 6px;border-radius:6px;font-size:15px;line-height:1;letter-spacing:-2px;touch-action:none;user-select:none;-webkit-user-select:none}
.handle:hover{color:var(--rasp);background:var(--blush-soft)}
.handle:disabled{opacity:.35;cursor:default}
tr.dragging td{background:var(--blush-soft)}
tr.dragging .handle{cursor:grabbing;color:var(--rasp)}
.gnr{display:inline-flex;align-items:center;gap:0;white-space:nowrap}
.guests .handle{padding:6px 4px;margin-left:-4px}
.g-samen{justify-content:flex-end}
.g-samen span{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);padding:8px 0}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.del{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:5px 8px;border-radius:6px;font-size:13px;white-space:nowrap}
.del:hover{color:var(--warn);background:var(--warn-soft)}
.del.armed{color:var(--on-accent);background:var(--warn)}

/* Overzicht (leesweergave) */
.ov-days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ov-card h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--plum)}
.ov-main{border-top:3px solid var(--rasp);gap:14px}
.ov-main .ov-h .eyebrow{margin:0 0 2px}
.ov-main h3{font-size:26px}
.ov-sub{margin:4px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ov-sub span,.gside h4 span{font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.ov-title{margin:8px 0 -4px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--plum)}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.facts{margin:0;display:flex;flex-direction:column}
.facts div{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dotted var(--line)}
.facts div:first-child{border-top:none;padding-top:0}
.facts dt{font-size:13px;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.schedule{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.schedule li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;position:relative;padding:0 0 10px;font-size:14px;line-height:1.4}
.schedule li:last-child{padding-bottom:0}
.schedule li::before{content:"";position:absolute;left:55px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--rasp)}
.schedule li:not(:last-child)::after{content:"";position:absolute;left:58px;top:15px;bottom:-1px;width:1px;background:var(--blush)}
.sch-time{font-weight:600;color:var(--plum);font-variant-numeric:tabular-nums}
.sch-what{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding-left:12px}

.sch-what small{font-size:13px;color:var(--muted)}
.gsides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gside h4{margin:0 0 4px;font-size:13px;color:var(--rasp);font-weight:600}
.gside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.panel-head .meta a{color:var(--rasp);font-weight:600}
.task.check-row textarea.title{resize:none;overflow:hidden;line-height:1.4}
.swatch{white-space:nowrap}
.gside li.opt{color:var(--muted);font-style:italic}
@media (max-width:760px){ .ov-days{grid-template-columns:1fr} .gsides{grid-template-columns:1fr 1fr} }
/* Overzicht (aanpassen) */
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.info-card h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--plum)}
.info-card.check{border-color:var(--rasp);background:var(--blush-soft)}
.info-card.check h3{color:var(--rasp)}
.irow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px;align-items:start;padding:4px 0;border-top:1px dotted var(--line)}
.irow:first-of-type{border-top:none}
.irow .lbl{font-size:13px;font-weight:600;color:var(--muted);padding-top:6px}
.irow textarea{resize:none;overflow:hidden;line-height:1.45}
.swatches{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px}
.swatch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swatch i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:block}

/* Taken */
.tasks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.task{display:grid;grid-template-columns:24px 26px minmax(0,1fr) 150px 112px 90px auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .main{display:flex;flex-direction:column;min-width:0}
.task .sub{font-size:12.5px;color:var(--muted);padding:0 7px 3px;display:flex;flex-wrap:wrap;gap:2px 10px}
.task .sub .cat{color:var(--rasp);font-weight:600}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task .flags{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.task.dragging{background:var(--blush-soft)}
.guests tr.dragging td{background:var(--blush-soft)}
.task .confirm{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--blush-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.task .confirm span{flex:1 1 200px;min-width:0}
.group-h{padding:10px 12px 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:var(--bg)}
@media (max-width:720px){
  .task{grid-template-columns:24px 26px minmax(0,1fr) auto;grid-template-areas:"h c m d" ". . date who" ". . f f"}
  .task>:nth-child(1){grid-area:h}.task>:nth-child(2){grid-area:c}.task>:nth-child(3){grid-area:m}.task>:nth-child(4){grid-area:date}
  .task>:nth-child(5){grid-area:who}.task>:nth-child(6){grid-area:f;flex-direction:row}.task>:nth-child(7){grid-area:d}
  .task .confirm{grid-area:auto;grid-column:1 / -1}
}

/* Te checken */
.checks{background:var(--gold-soft);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.checks h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
.checks h3 span{font-weight:500;margin-left:4px}
.task.check-row{grid-template-columns:26px minmax(0,1fr) auto}
.add-inline{display:flex;gap:8px}
.add-inline input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.confirm .ov-fields{flex:1 1 100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.confirm .ov-fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.confirm .ov-fields input{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-weight:400;font-size:14px;color:var(--ink)}
@media (max-width:720px){ .task.check-row{grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:none} .task.check-row>*{grid-area:auto!important} .confirm .ov-fields{grid-template-columns:1fr} }
/* Budget: btw en kost per gast */
.w-vat{width:118px}
.w-vat select{font-size:13px}
.vat-incl{display:block;font-size:11.5px;color:var(--muted);padding:0 6px 3px;white-space:nowrap}
.cost-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rasp);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cost-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-start}
.cost-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--plum)}
.cost-head .meta{margin:2px 0 0;font-size:13px}
.cost-big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.cost-big b{font-size:28px;font-weight:600;color:var(--plum);font-variant-numeric:tabular-nums}
.cost-big span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.cost-split{width:100%}
.cost-split th{position:static}
.cost-split td{padding:8px 6px}
.cost-split td small{display:block;font-size:12.5px;color:var(--muted)}
.cost-split td b{font-weight:600}
.cost-split td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* Opvolging */
.orders{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.order{display:grid;grid-template-columns:22px minmax(0,1fr) 170px 150px 120px auto;gap:8px;align-items:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:none}
.order input[type=checkbox]{margin-top:8px}
.obody{display:flex;flex-direction:column;min-width:0}
.obody textarea{resize:none;overflow:hidden;line-height:1.4}
.obody .ow{font-weight:500}
.obody .onote{font-size:13.5px;color:var(--muted);padding-top:0}
.order.done .ow{text-decoration:line-through;color:var(--muted);font-weight:400}
.odate{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.odate small{padding-left:7px}
.ostate{padding-top:6px}
@media (max-width:760px){
  .order{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"c b d" ". bij bij" ". dt st"}
  .order>input[type=checkbox]{grid-area:c}.order .obody{grid-area:b}.order .obij{grid-area:bij}.order .odate{grid-area:dt}.order .ostate{grid-area:st}.order>.del{grid-area:d}
}
/* Agenda */
.agenda{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rasp);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ag-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px}
.ag-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--plum)}
.ag-head .meta{display:block}
.ag-add{flex-wrap:wrap}
.ag-add input{flex:1 1 150px}
.ag-add input[type=date]{flex:0 0 auto}
.ag-add input[name=uur]{flex:0 0 90px}
.ag-weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ag-week{background:var(--bg);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ag-week.now{outline:2px solid var(--blush);outline-offset:-2px}
.ag-wh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding-bottom:4px}
.ag-wh b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--plum)}
.ag-wh span:not(.tag){font-size:13px;color:var(--muted)}
.tag.ag-now{background:var(--blush-soft);color:var(--rasp)}
.tag.ag-mijl{background:var(--plum);color:var(--on-accent)}
.tag.ag-tag{background:var(--blush-soft);color:var(--plum)}
.ag-item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;grid-template-areas:"d w t" "h w t";gap:0 8px;align-items:start;padding:6px 0;border-top:1px dotted var(--line);font-size:14px}
.ag-item.ag-ev{display:block}
.ag-ev summary{display:grid;grid-template-columns:62px minmax(0,1fr) auto;grid-template-areas:"d w t" "h w t";gap:0 8px;align-items:start;cursor:pointer;list-style:none}
.ag-ev summary::-webkit-details-marker{display:none}
.ag-ev[open] summary .ag-what b{color:var(--plum)}
.ag-day{grid-area:d;color:var(--muted);font-size:12.5px;white-space:nowrap}
.ag-time{grid-area:h;font-weight:600;color:var(--plum);font-size:12.5px;font-variant-numeric:tabular-nums}
.ag-what{grid-area:w;display:flex;flex-direction:column;min-width:0}
.ag-what b{font-weight:500;line-height:1.3}
.ag-what small{color:var(--muted);font-size:12.5px}
.ag-item>.tag,.ag-ev summary>.tag{grid-area:t}
.ag-task.done .ag-what b{text-decoration:line-through;color:var(--muted)}
.ag-edit{display:flex;flex-wrap:wrap;gap:6px 8px;padding:8px 0 2px}
.ag-edit label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);font-weight:600;flex:0 1 130px;min-width:0}
.ag-edit label.grow{flex:1 1 160px}
.ag-edit label.full{flex:1 1 100%}
.ag-edit .cell{background:var(--surface);border:1px solid var(--line)}
.ag-late{display:flex;flex-direction:column;padding-bottom:4px}
.ag-sub{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);font-weight:600;padding:4px 0 2px}
.ag-empty{color:var(--muted);font-size:13.5px;padding:6px 0;border-top:1px dotted var(--line)}
.hide-btn{padding:4px 12px;font-size:13px;margin-left:8px}
.hidden-budget{display:flex;flex-direction:column;align-items:center;gap:12px}
.hidden-budget p{margin:0}
/* Menu */
.mlayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.mlayout .msum{grid-column:2;grid-row:1;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.mlayout .mmain{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.msec,.msum{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.msum{border-top:3px solid var(--rasp)}
.msec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.msec-head h3,.mtitle{margin:0;font-family:var(--display);font-weight:400;font-size:22px;color:var(--plum)}
.mtitle{font-size:26px;margin-top:6px}
.mtitle-sub{margin:-8px 0 0}
.msec>.meta{margin:0}
.mcount{font-size:13px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mcount.ok{background:var(--ok-soft);color:var(--ok)}
.dgroup h4{margin:4px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dgroup .meta{margin:-2px 0 6px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.dish{font:inherit;text-align:left;display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;cursor:pointer;color:var(--ink);min-width:0;transition:border-color .15s,background .15s}
.dish:hover{border-color:var(--rasp)}
.dish-tick{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;background:var(--surface)}
.dish-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dish-txt b{font-weight:500;line-height:1.3}
.dish-txt small{color:var(--muted);font-size:13px;line-height:1.35}
.dish.on{border-color:var(--plum);background:var(--blush-soft)}
.dish.on .dish-tick{background:var(--plum);border-color:var(--plum);color:var(--on-accent)}
.dish.full{opacity:.5}
.dish-c{position:relative;display:flex;min-width:0}
.dish-c .dish{flex:1;padding-right:34px}
.dish-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;border-radius:50%}
.dish-x:hover{background:var(--line);color:var(--warn)}
.mvoor{margin-top:6px}
.mvoor input{background:var(--bg)}
.dgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dblok{background:var(--bg);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dblok h4{margin:0;font-family:var(--display);font-weight:400;font-size:19px;color:var(--plum)}
.dblok>.meta{margin:0 0 4px}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dlist li{display:grid;grid-template-columns:minmax(0,1fr) 28px;grid-template-areas:"n x" "o x";align-items:start;padding:4px 0;border-top:1px dotted var(--line)}
.dlist .dname{grid-area:n;font-weight:500}
.dlist .dnote{grid-area:o;font-size:13.5px;color:var(--muted);padding-top:0}
.dlist .dish-x{grid-area:x;position:static}
.dblok .mvoor input{background:var(--surface)}
.mown{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--rasp);font-weight:600}
.dish:disabled{cursor:default}
.mline{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px dotted var(--line);font-size:14px}
.mline .ml{color:var(--muted)}
.mline .mv{display:flex;flex-direction:column;gap:3px;min-width:0}
.mline.todo .mv em{color:var(--warn);font-style:normal}
.mline .mv em{color:var(--muted);font-style:normal}
.mnote{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.mnote textarea{font:inherit;font-weight:400;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;resize:none;overflow:hidden}
@media (max-width:900px){
  .mlayout{grid-template-columns:1fr}
  .mlayout .msum{grid-column:1;grid-row:auto;position:static;max-height:none}
  .mlayout .mmain{grid-column:1;grid-row:auto}
}
/* Vragen */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.qgrid.single{grid-template-columns:1fr}
.qgrid.single .qcard{font-size:16px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--plum)}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 0;border-top:1px dotted var(--line)}
.qlist li:first-child{border-top:none}
.qlist li input[type=checkbox]{margin-top:8px}
.qbody{display:flex;flex-direction:column;min-width:0}
.qbody textarea{resize:none;overflow:hidden;line-height:1.4}
.qbody .qq{font-weight:500}
.qbody .qa{font-size:13.5px;color:var(--muted);padding-top:0}
.qlist li.done .qq{text-decoration:line-through;color:var(--muted);font-weight:400}
/* Tafels */
.unplaced{border:1px dashed var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.unplaced h3,.table-card h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:5px;max-height:220px;overflow:auto}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.table-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.table-card .row{display:flex;gap:8px;align-items:center}
.table-card .tname{font-family:var(--display);font-size:20px;color:var(--plum)}
.seats{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;white-space:nowrap}
.seats input{width:52px}
.cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cap.over{color:var(--warn);font-weight:600}
.seated{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.seated li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:3px 0;border-bottom:1px dotted var(--line)}
.seated li:last-child{border-bottom:none}
.seated .x{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
.seated .x:hover{color:var(--warn);background:var(--warn-soft)}
.table-card select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg);width:100%}

/* Tafelplan (bovenaanzicht) */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:28px;height:14px;border-radius:7px;margin-right:6px;vertical-align:-2px}
.unplaced .pills .pill{cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.unplaced .pills .pill:hover{border-color:var(--rasp)}
.unplaced .pills .pill[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--on-accent)}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;align-items:start}
.tplan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tplan .thead{display:flex;align-items:center;gap:6px}
.tplan .tname{font-family:var(--display);font-size:20px;color:var(--plum)}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);grid-auto-rows:30px;gap:6px 8px}
.tbl{grid-column:2;background:var(--table);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tbl span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.seat{border:1px solid transparent;border-radius:15px;font:inherit;font-size:12.5px;font-weight:600;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0;text-align:center}
.seat.ok{background:var(--seat-ok);color:var(--seat-ok-ink)}
.seat.wait{background:var(--seat-wait);color:var(--seat-wait-ink)}
.seat.free{background:var(--seat-free);color:var(--seat-free-ink);border-color:var(--seat-free-line);font-weight:500}
.seat:hover{filter:brightness(1.06)}
.seat.sel{outline:3px solid var(--plum);outline-offset:2px}
.counter{display:flex;align-items:center;justify-content:center;gap:16px}
.counter button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer;color:var(--plum)}
.counter button:hover{border-color:var(--rasp)}
.counter button:disabled{opacity:.5;cursor:default}
.counter .cnt{text-align:center;line-height:1.1;min-width:60px}
.counter .cnt b{display:block;font-size:24px;font-variant-numeric:tabular-nums;color:var(--plum)}
.counter .cnt small{font-size:12px;color:var(--muted)}
.tmeta{text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);z-index:15;display:flex;flex-direction:column;gap:10px;
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--plum)}
.sheet p{margin:0}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px}
.btn.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
.glist{display:flex;flex-direction:column;max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.glist button{font:inherit;text-align:left;border:none;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
.glist button:last-child{border-bottom:none}
.glist button:hover{background:var(--blush-soft)}
.glist small{color:var(--muted);white-space:nowrap}
body.sheet-open{padding-bottom:62vh}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:var(--radius);padding:10px 14px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}

@media (max-width:760px){
  .summary{grid-template-columns:1fr}
  .info{grid-template-columns:1fr}
  .countdown{text-align:left}
  .irow{grid-template-columns:minmax(0,1fr) auto}
  .irow .lbl{grid-column:1 / -1;padding-top:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Aanmelden */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:40;
  padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.login-card{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.login-card h1{justify-content:center;font-size:44px}
.login-card label{font-size:13px;color:var(--muted);font-weight:600;text-align:left}
.login-card input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;font-size:17px;text-align:center;letter-spacing:.08em}
.login-card .btn{padding:12px}
.sync{font-size:12px;color:var(--muted);margin-top:4px}
.linkbtn{border:none;background:none;color:var(--rasp);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
/* Uitnodigingen */
.inv-settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.inv-settings summary{cursor:pointer;font-weight:600;color:var(--plum)}
.inv-settings .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin-top:12px}
.inv-settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.inv-settings input,.inv-settings textarea{font-weight:400;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0;resize:vertical}
.inv-stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.inv-stats b{color:var(--ink)}
.invs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.inv{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.inv-top{display:flex;gap:12px;align-items:flex-start}
.inv-code{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.inv-code small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inv-code b{font-size:17px;letter-spacing:.06em;color:var(--plum);font-variant-numeric:tabular-nums;white-space:nowrap}
.qr-all{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.qr-all .qr{width:112px;flex:0 0 112px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#fff}
.qr-all .qr svg{display:block;width:100%;height:auto}
.qr-all .txt{flex:1 1 240px;display:flex;flex-direction:column;gap:6px;min-width:0;font-size:14px}
.qr-all code{font-size:12px;color:var(--muted);word-break:break-all}
.inv-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.inv-name{font-family:var(--display);font-size:19px;color:var(--plum);padding-left:0}
.inv-link code{font-size:11.5px;color:var(--muted);word-break:break-all}
.inv-acts{display:flex;flex-wrap:wrap;gap:6px}
.inv-acts .chip-btn{text-decoration:none;font-size:12.5px}
.inv-msg{margin:0;padding:8px 12px;background:var(--blush-soft);border-radius:8px;font-size:14px;white-space:pre-line}
.inv-members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.inv-members li{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px dotted var(--line);font-size:14px}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:14px}
.lockbar label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--plum);white-space:nowrap}
.lockbar .meta{flex:1 1 240px;font-size:13px}
.lockbar.ask{background:var(--warn-soft);border-color:var(--warn)}
.lockbar.ask > div:first-child{flex:1 1 260px}
.lockbar .acts{display:flex;flex-wrap:wrap;gap:8px}
.lockbar.on{background:var(--ok-soft);border-color:var(--ok);align-items:flex-start;flex-wrap:nowrap}
.lockbar .lock-ic{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ok);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.inv-members li.dragging{background:var(--blush-soft);border-radius:6px}
.inv-members .handle{padding:4px 4px;margin-left:-4px}
.inv-members .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-members .x{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px}
.inv-members .x:hover{color:var(--warn);background:var(--warn-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--line)}
.dot.ja{background:var(--seat-ok)}.dot.nee{background:var(--warn)}
.inv-acts .addr-btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.inv-addr{margin:0;font-size:13.5px;color:var(--muted)}
.addr-form{display:flex;flex-wrap:wrap;gap:10px}
.addr-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.addr-form label.full,.addr-form .full{flex:1 1 100%}
.addr-form label.grow{flex:1 1 180px}
.addr-form label small{font-weight:400}
.addr-form input{font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%}
.addr-form input[name=postcode]{width:110px}
.addr-known{display:flex;flex-wrap:wrap;gap:6px}
.addr-form .acts{display:flex;flex-wrap:wrap;gap:8px}
.inv-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:760px){ .inv-settings .grid{grid-template-columns:1fr} }
/* App-gevoel: tabbladen blijven bovenaan staan */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:7}
/* Compacte kop en overzicht op de iPhone */
@media (max-width:760px){
  body{padding-block:14px 48px}
  .wrap{gap:16px}
  .top{align-items:center;padding-bottom:12px}
  .top h1{font-size:34px}
  .venue{font-size:13px}
  .countdown{text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
  .countdown .big{font-size:30px}
  .countdown .sync{width:100%;margin-top:0}
  .countdown .sub{font-size:11px}
  .summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{padding:10px 10px;gap:4px}
  .stat .label{font-size:10px;letter-spacing:.04em}
  .stat .value{font-size:17px}
  .stat .value small{display:block;font-size:11px}
  .stat .foot{display:none}
}
/* Bodoni Moda past zijn haarlijnen aan de lettergrootte aan; bij grote titels worden die bijna onzichtbaar.
   Daarom altijd de stevige variant voor kleine tekst (optische grootte 11) gebruiken. */
:root{font-optical-sizing:none;font-variation-settings:"opsz" 11}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <p class="eyebrow">Zaterdag 10 juli 2027</p>
    <h1>Florence <span class="amp">&amp;</span> Louis</h1>
    <label for="pin">Toegangscode</label>
    <input id="pin" name="pin" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Openen</button>
    <p id="login-msg" class="meta" role="alert"></p>
  </form>
</div>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Zaterdag 10 juli 2027</p>
      <h1>Florence <span class="amp">&amp;</span> Louis</h1>
    </div>
    <div class="countdown">
      <div class="big" id="days">–</div>
      <div class="sub" id="days-sub">dagen tot de grote dag</div>
      <div class="sync"><span id="sync-state"></span> · <button id="logout" class="linkbtn" type="button">Afmelden</button></div>
    </div>
  </header>

  <section class="summary" aria-label="Overzicht">
    <div class="stat">
      <span class="label">Gasten bevestigd</span>
      <span class="value" id="s-guests">–</span>
      <div class="bar" id="s-guests-bar"><span style="width:0"></span></div>
      <span class="foot" id="s-guests-foot"></span>
    </div>
    <div class="stat">
      <span class="label">Budget vastgelegd</span>
      <span class="value" id="s-budget">–</span>
      <div class="bar" id="s-budget-bar"><span style="width:0"></span></div>
      <span class="foot" id="s-budget-foot"></span>
    </div>
    <div class="stat">
      <span class="label">Taken gedaan</span>
      <span class="value" id="s-tasks">–</span>
      <div class="bar" id="s-tasks-bar"><span style="width:0"></span></div>
      <span class="foot" id="s-tasks-foot"></span>
    </div>
  </section>

  <nav class="tabs" aria-label="Onderdelen">
    <a href="#overzicht" data-tab="overzicht">Overzicht</a>
    <a href="#gasten" data-tab="gasten">Gasten<span class="n" id="n-gasten"></span></a>
    <a href="#budget" data-tab="budget">Budget<span class="n" id="n-budget"></span></a>
    <a href="#taken" data-tab="taken">Taken<span class="n" id="n-taken"></span></a>
    <a href="#vragen" data-tab="vragen">Vragen<span class="n" id="n-vragen"></span></a>
    <a href="#opvolging" data-tab="opvolging">Opvolging<span class="n" id="n-opvolging"></span></a>
    <a href="#menu" data-tab="menu">Menu<span class="n" id="n-menu"></span></a>
    <a href="#tafels" data-tab="tafels">Tafelschikking<span class="n" id="n-tafels"></span></a>
    <a href="#uitnodigingen" data-tab="uitnodigingen">Uitnodigingen<span class="n" id="n-uitn"></span></a>
  </nav>

  <div id="notice" class="notice" hidden></div>
  <main id="main"><div class="empty">Gegevens laden…</div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-label="Plaats aan tafel" hidden></div>

<script src="config.js?v=20261028a"></script>
<script src="api.js?v=20261028a"></script>
<script src="vendor/qrcode.js"></script>
<script>
(function(){
  const WEDDING = new Date(2027, 6, 10);
  const TABS = ["overzicht","gasten","budget","taken","vragen","opvolging","menu","tafels","uitnodigingen"];
  const COLS = ["guests","households","budget","tasks","tables","info","questions","orders","menu","events"];
  const S = { guests:[], households:[], budget:[], tasks:[], tables:[], info:[], questions:[], orders:[], menu:[], events:[], settings:{}, canWrite:true, dbOk:null };
  const F = { q:"", via:"alle", status:"alle", burg:false, rel:"", taskView:"open", taskCat:"" };
  let db = null, pending = false;
  const main = document.getElementById("main");
  const RELATIES = ["Familie","Ouders","Vrienden","Collega","Kennis","Bruid","Bruidegom"];
  const SECTION_ORDER = ["Burgerlijke trouw · 3 juli","Trouwfeest · 10 juli","Locatie","Na te kijken","Leveranciers","Getuigen","Familie","Catering (offerte V1, 11/02/2026)","Uitnodiging","Huisstijl"];

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const eur = n => new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
  const eur2 = n => new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
  const moneyIn = n => (n ? String(n).replace(".", ",") : "");
  const parseMoney = v => { const s = String(v).replace(/\s|€/g,""); const n = parseFloat(s.includes(",") ? s.replace(/\./g,"").replace(",", ".") : s); return isFinite(n) ? Math.round(n*100)/100 : 0; };
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const daysUntil = iso => { if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); return Math.round((new Date(y,m-1,d) - today())/864e5); };
  const fmtMonth = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("nl-BE",{day:"numeric",month:"short",year:"numeric"}); };
  const partnerLabel = () => "Florence";
  // Budget verbergen (bv. als je de app aan iemand toont): enkel op dit toestel, onthouden in de browser.
  const PRIV = { hide: (() => { try { return localStorage.getItem("tp_hide_budget") === "1"; } catch(_) { return false; } })() };
  function setHideBudget(v){ PRIV.hide = v; try { localStorage.setItem("tp_hide_budget", v ? "1" : ""); } catch(_) {} renderAll(true); toast(v ? "Budget verborgen" : "Budget weer zichtbaar"); }
  const maskMoney = str => PRIV.hide ? String(str ?? "").replace(/€\s?\d[\d.,]*/g, "€ •••") : str;
  // Volgorde van de gastenlijst: kolom "volgorde" (versleepbaar, mag een kommagetal zijn), anders het gastnummer.
  const guestRank = g => { const v = Number(g.volgorde); return g.volgorde !== "" && g.volgorde != null && isFinite(v) ? v : (Number(g.nr) || 9999); };
  const guestsSorted = () => [...S.guests].sort((a,b) => guestRank(a) - guestRank(b) || (a.created||0) - (b.created||0));
  // Vergrendeling: zodra de uitnodigingen verstuurd zijn, mogen de gezinnen en hun code (6 cijfers) nooit meer veranderen.
  const invitesLocked = () => !!String(S.settings.uitnodigingen_verstuurd || "").trim();
  const dis = () => S.canWrite ? "" : " disabled";
  const currentTab = () => { const h = location.hash.slice(1); return TABS.includes(h) ? h : "overzicht"; };
  const gname = g => [g.voornaam, g.achternaam].filter(Boolean).join(" ") || "Naamloos";
  const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
  // Een +1 is enkel "optioneel" zolang hij niet bevestigd is; komt hij, dan is het een gewone gast.
  const isOpt = g => !!g.optioneel && g.status !== "ja";
  const isCounted = g => !isOpt(g) && g.status !== "nee";

  function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 3600); }
  function showNotice(msg){ const n = document.getElementById("notice"); n.textContent = msg; n.hidden = !msg; }
  function handleErr(e){
    const code = e && e.code;
    if(code === "unauthorized") return; // de app vraagt de code opnieuw
    if(code === "not_configured") toast(e.message);
    else if(e && e.message === "unknown_collection") toast("Werk eerst het script (Code.gs) bij, dan kan je dit bewaren.");
    else if(e && e.message === "locked") toast("De uitnodigingen zijn verstuurd: dit kan niet meer gewijzigd worden.");
    else toast("Opslaan lukte niet. Controleer je internetverbinding; de gegevens worden opnieuw geladen.");
    console.error(e);
  }

  // ---------- writes ----------
  const chains = {};
  function write(col, id, patch){
    if(!db || !S.canWrite) return;
    const key = col + "/" + id;
    db.collection(col).doc(id).update(patch).catch(handleErr);
  }
  function add(col, data){ if(!db || !S.canWrite) return; return db.collection(col).add(Object.assign({}, data, { created: Date.now() })).catch(handleErr); }
  function remove(col, id){ if(!db || !S.canWrite) return; return db.collection(col).doc(id).delete().catch(handleErr); }
  function saveSettings(patch){
    if(!db || !S.canWrite) return;
    const next = Object.assign({}, S.settings, patch);
    db.doc("meta/settings").set(patch).catch(handleErr);
  }

  // ---------- summary ----------
  function setBar(id, pct, over){ const b = document.getElementById(id); b.firstElementChild.style.width = Math.max(0, Math.min(100, pct)) + "%"; b.classList.toggle("over", !!over); }
  function renderSummary(){
    const d = Math.round((WEDDING - today())/864e5);
    document.getElementById("days").textContent = d > 0 ? d : (d === 0 ? "Vandaag!" : "✓");
    document.getElementById("days-sub").textContent = d > 1 ? "dagen tot de grote dag" : d === 1 ? "dag tot de grote dag" : d === 0 ? "" : "getrouwd";

    const counted = S.guests.filter(isCounted);
    const yes = S.guests.filter(g => g.status === "ja").length;
    const opt = S.guests.filter(g => isOpt(g) && g.status !== "nee").length;
    const no = S.guests.filter(g => g.status === "nee").length;
    document.getElementById("s-guests").innerHTML = `${yes} <small>van ${counted.length}</small>`;
    document.getElementById("s-guests-foot").textContent = `${opt} optionele +1 · ${no} afgezegd`;
    setBar("s-guests-bar", counted.length ? yes/counted.length*100 : 0);

    const est = sum(S.budget, b => inclVat(b, b.geraamd)), fixed = sum(S.budget.filter(b => b.vastgelegd), b => inclVat(b, b.geraamd));
    const real = sum(S.budget, b => inclVat(b, b.werkelijk));
    if(PRIV.hide){
      document.getElementById("s-budget").innerHTML = `<small>verborgen</small>`;
      document.getElementById("s-budget-foot").textContent = "";
      setBar("s-budget-bar", 0);
    } else {
      document.getElementById("s-budget").innerHTML = `${eur(fixed)} <small>van ${eur(est)}</small>`;
      document.getElementById("s-budget-foot").textContent = real ? `Werkelijke kosten ingevuld: ${eur(real)}` : "Totaal geraamd, inclusief 10% reserve";
      setBar("s-budget-bar", est ? fixed/est*100 : 0);
    }

    const realTasks = S.tasks.filter(t => t.categorie !== CAT_CHECK);
    const done = realTasks.filter(t => t.done).length;
    const late = realTasks.filter(t => !t.done && t.deadline && daysUntil(t.deadline) < 0).length;
    document.getElementById("s-tasks").innerHTML = `${done} <small>van ${realTasks.length}</small>`;
    document.getElementById("s-tasks-foot").innerHTML = late ? `<b>${late} over de uiterste datum</b>` : "Alles op schema";
    setBar("s-tasks-bar", realTasks.length ? done/realTasks.length*100 : 0);

    document.getElementById("n-gasten").textContent = S.guests.length || "";
    document.getElementById("n-budget").textContent = S.budget.length || "";
    document.getElementById("n-taken").textContent = S.tasks.filter(t => !t.done).length || "";
    document.getElementById("n-tafels").textContent = S.tables.length || "";
    document.getElementById("n-vragen").textContent = S.questions.filter(q => !q.beantwoord).length || "";
    document.getElementById("n-opvolging").textContent = S.orders.filter(o => !o.toegekomen).length || "";
    document.getElementById("n-menu").textContent = menuOpen() || "";
    document.getElementById("n-uitn").textContent = S.households.filter(h => !h.rsvp_op).length || "";
    document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === currentTab() ? "page" : "false"));
  }

  const delBtn = (col, id) => `<button class="del" data-del="${col}" data-id="${esc(id)}"${dis()}>Verwijder</button>`;
  const attrs = (col, id, f, extra) => `data-col="${col}" data-id="${esc(id)}" data-f="${f}"${extra ? " " + extra : ""}${dis()}`;

  // ---------- overzicht ----------
  // Leesweergave: eerst de burgerlijke trouw, dan het trouwfeest met dagschema, dan alles wat vaststaat.
  // "Vastgelegd" komt uit het tabblad Info én uit afgevinkte taken met een overzichtslabel (kolommen overzicht / overzicht_info).
  const OV = { edit:false };
  const SEC_BURG = "Burgerlijke trouw · 3 juli", SEC_FEEST = "Trouwfeest · 10 juli", CAT_CHECK = "Te checken";
  const CARD_ORDER = ["Ceremonie","Getuigen","Catering","Muziek","Foto & Video","Kleding & Make-Up","Bloemen & Deco","Vervoer","Uitnodigingen","Administratie","Locatie","Dag zelf","Familie","Huisstijl"];
  const isTimeVal = v => /^\s*\d{1,2}u\d{0,2}\b/.test(String(v || ""));
  const infoSorted = list => [...list].sort((a,b) => (Number(a.volgorde)||Number(a.created)||0) - (Number(b.volgorde)||Number(b.created)||0));
  const doneForOverview = () => S.tasks.filter(t => t.done && String(t.overzicht || "").trim() && t.categorie !== CAT_CHECK);
  const taskFact = t => ({ label: String(t.overzicht).trim(), value: String(t.overzicht_info || "").trim() || String(t.leverancier || "").trim() || "geregeld" });
  function swatchesOf(v){
    const hs = String(v || "").match(/#[0-9a-f]{6}/ig);
    return hs ? `<div class="swatches">${hs.map(h => `<span class="swatch"><i style="background:${h}"></i>${h}</span>`).join("")}</div>` : "";
  }
  function factList(facts){
    if(!facts.length) return "";
    return `<dl class="facts">${facts.map(f => `<div><dt>${esc(f.label)}</dt><dd>${esc(maskMoney(f.value))}${swatchesOf(f.value)}</dd></div>`).join("")}</dl>`;
  }
  function scheduleHtml(items){
    if(!items.length) return "";
    return `<ol class="schedule">${items.map(i => {
      const m = /^\s*(\d{1,2}u\d{0,2})\s*(?:[–-]\s*(\d{1,2}u\d{0,2}))?\s*(.*)$/.exec(i.waarde);
      return `<li><span class="sch-time">${esc(m ? m[1] : i.waarde)}</span><span class="sch-what"><span>${esc(i.label)}</span>${m && m[2] ? `<small>tot ${esc(m[2])}</small>` : ""}${m && m[3] ? `<small>${esc(m[3])}</small>` : ""}</span></li>`;
    }).join("")}</ol>`;
  }
  function viewInfo(){
    if(OV.edit) return viewInfoEdit();
    const groups = {};
    S.info.forEach(i => { (groups[i.sectie] = groups[i.sectie] || []).push(i); });
    const tasksBy = {};
    doneForOverview().forEach(t => { (tasksBy[t.categorie || "Overige"] = tasksBy[t.categorie || "Overige"] || []).push(t); });
    const split = sec => { const items = infoSorted(groups[sec] || []); return { times: items.filter(i => isTimeVal(i.waarde)), facts: items.filter(i => !isTimeVal(i.waarde)).map(i => ({ label: i.label, value: i.waarde })) }; };

    // Burgerlijke trouw
    const burg = split(SEC_BURG);
    const burgFacts = burg.facts.concat((tasksBy["Burgerlijke trouw"] || []).map(taskFact));
    const bg = S.guests.filter(g => g.burgerlijk && g.status !== "nee" && !isCouple(g)).sort((a,b) => guestRank(a) - guestRank(b));
    const side = (via, title) => { const l = bg.filter(g => (g.via || "louis") === via); return l.length ? `<div class="gside"><h4>${title} <span>${l.length}</span></h4><ul>${l.map(g => `<li${isOpt(g) ? ' class="opt"' : ""}>${esc(gname(g))}</li>`).join("")}</ul></div>` : ""; };
    const burgCard = `<section class="ov-card ov-main">
        <div class="ov-h"><p class="eyebrow">Zaterdag 3 juli 2027</p><h3>Burgerlijke trouw</h3></div>
        ${scheduleHtml(burg.times)}${factList(burgFacts)}
        <div class="ov-guests"><h4 class="ov-sub">Gasten <span>${bg.length}</span></h4>
          ${bg.length ? `<div class="gsides">${side("florence", "Kant Florence")}${side("louis", "Kant Louis")}</div>` : `<p class="meta">Nog niemand aangeduid. Vink "Burg." aan bij Gasten.</p>`}</div>
      </section>`;

    // Trouwfeest
    const feest = split(SEC_FEEST);
    const feestCard = `<section class="ov-card ov-main">
        <div class="ov-h"><p class="eyebrow">Zaterdag 10 juli 2027</p><h3>Trouwfeest</h3></div>
        ${factList(feest.facts)}
        ${feest.times.length ? `<h4 class="ov-sub">Dagschema</h4>${scheduleHtml(feest.times)}` : ""}
      </section>`;

    // Vastgelegd: info-onderdelen en afgevinkte taken, per onderdeel samengevoegd
    const cards = {};
    Object.keys(groups).filter(n => n !== SEC_BURG && n !== SEC_FEEST && n !== "Na te kijken").forEach(n => {
      cards[n] = (cards[n] || []).concat(infoSorted(groups[n]).map(i => ({ label: i.label, value: i.waarde })));
    });
    Object.keys(tasksBy).filter(n => n !== "Burgerlijke trouw").forEach(n => { cards[n] = (cards[n] || []).concat(tasksBy[n].map(taskFact)); });
    const st = S.settings, inv = [];
    if(st.rsvp_deadline) inv.push({ label: "Antwoorden vóór", value: fmtMonth(st.rsvp_deadline) });
    if(st.rsvp_dresscode) inv.push({ label: "Dresscode", value: st.rsvp_dresscode });
    if(st.site_url) inv.push({ label: "Webadres", value: st.site_url });
    if(invitesLocked()) inv.push({ label: "Verstuurd", value: fmtStamp(st.uitnodigingen_verstuurd) });
    if(inv.length) cards["Uitnodigingen"] = inv.concat(cards["Uitnodigingen"] || []);
    const names = Object.keys(cards).filter(n => cards[n].length).sort((a,b) => {
      const ia = CARD_ORDER.indexOf(a), ib = CARD_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "nl");
    });
    const fixed = names.map(n => `<section class="ov-card"><h3>${esc(n)}</h3>${factList(cards[n])}</section>`).join("");
    const openChecks = S.tasks.filter(t => t.categorie === CAT_CHECK && !t.done).length;
    return `
      <div class="panel-head"><h2>Overzicht</h2><span class="meta">${openChecks ? `<a href="#taken">${openChecks} ${openChecks === 1 ? "punt" : "punten"} te checken</a> · ` : ""}<button class="linkbtn" data-ov-edit type="button">Aanpassen</button></span></div>
      <div class="ov-days">${burgCard}${feestCard}</div>
      <h3 class="ov-title">Vastgelegd</h3>
      ${fixed ? `<div class="ov-grid">${fixed}</div>` : `<div class="empty">Nog niets vastgelegd. Vink taken af bij Taken.</div>`}`;
  }
  function viewInfoEdit(){
    const groups = {};
    S.info.forEach(i => { (groups[i.sectie] = groups[i.sectie] || []).push(i); });
    const names = Object.keys(groups).sort((a,b) => {
      const ia = SECTION_ORDER.indexOf(a), ib = SECTION_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "nl");
    });
    const rows = n => groups[n].sort((a,b) => (a.volgorde||a.created||0) - (b.volgorde||b.created||0)).map(i => {
      const sw = /#[0-9a-f]{6}/i.test(i.waarde || "") ? `<div class="swatches">${(i.waarde.match(/#[0-9a-f]{6}/ig)||[]).map(h => `<span class="swatch"><i style="background:${h}"></i>${h}</span>`).join("")}</div>` : "";
      return `<div class="irow"><span class="lbl">${esc(i.label)}</span>
        <div><textarea class="cell auto" rows="1" ${attrs("info", i.id, "waarde", 'aria-label="' + esc(i.label) + '"')}>${esc(i.waarde)}</textarea>${sw}</div>
        ${delBtn("info", i.id)}</div>`;
    }).join("");
    const cards = names.map(n => `<section class="info-card"><h3>${esc(n)}</h3>${rows(n)}</section>`).join("");
    return `

  // ---------- budget ----------
  // Btw per post: leeg = bedrag is incl. btw; "21", "12" of "6" = bedrag is excl. dat tarief. Totalen zijn altijd incl. btw.
  const VAT = { "21":0.21, "12":0.12, "6":0.06 };
  const vatRate = b => VAT[String(b.btw || "")] || 0;
  const inclVat = (b, v) => Math.round((Number(v) || 0) * (1 + vatRate(b)) * 100) / 100;
  const postCost = b => inclVat(b, Number(b.werkelijk) ? b.werkelijk : b.geraamd);
  // Kolom "eigen": aangevinkt = kost is sowieso voor jullie (bv. huwelijkscontract); niet aangevinkt = wordt per gast verdeeld met de ouders.
  const isOwn = b => b.eigen === true || String(b.eigen || "").toUpperCase() === "TRUE";
  // Wie betaalt welke gast: familie en vrienden van de ouders (relatie Familie / Ouders) betalen de ouders van die kant, de rest betalen jullie.
  const BG = { basis:"uitgenodigd" };
  function payerOf(g){
    if(g.relatie === "Familie" || g.relatie === "Ouders") return g.via === "florence" ? "chantal" : "ouders_louis";
    return "koppel";
  }
  function costSplit(){
    const guests = S.guests.filter(g => BG.basis === "bevestigd" ? g.status === "ja" : g.status !== "nee");
    const r2 = v => Math.round(v * 100) / 100;
    const total = r2(sum(S.budget.filter(b => !isOwn(b)), postCost)), own = r2(sum(S.budget.filter(isOwn), postCost));
    const n = guests.length, per = n ? total / n : 0;
    const groups = [
      { k:"koppel", naam:"Florence & Louis", wie:"vrienden, collega's, kennissen en jullie twee" },
      { k:"ouders_louis", naam:"Ouders Louis", wie:"familie en vrienden van de ouders, kant Louis" },
      { k:"chantal", naam:"Chantal", wie:"familie en vrienden van de ouders, kant Florence" },
    ].map(x => { const c = guests.filter(g => payerOf(g) === x.k).length; return Object.assign(x, { n: c, gasten: c * per, bedrag: c * per + (x.k === "koppel" ? own : 0) }); });
    return { total, own, n, per, groups };
  }
  function costCard(){
    const c = costSplit();
    const bchip = (k, l) => `<button class="chip-btn" data-bbasis="${k}" aria-pressed="${BG.basis === k}">${l}</button>`;
    return `<section class="cost-card">
        <div class="cost-head"><div><h3>Kost per gast</h3><p class="meta">Gedeelde posten incl. btw (werkelijk waar ingevuld, anders geraamd) gedeeld door het aantal gasten. Posten met 'Enkel wij' betalen jullie volledig zelf.</p></div>
          <div class="chips">${bchip("uitgenodigd", "Alle uitgenodigden")}${bchip("bevestigd", "Enkel bevestigd")}</div></div>
        <div class="cost-big"><b>${c.n ? eur2(c.per) : "—"}</b><span>${eur2(c.total)} gedeeld ÷ ${c.n} gasten</span></div>
        <table class="cost-split"><thead><tr><th>Wie betaalt</th><th class="num">Gasten</th><th class="num">Bedrag</th></tr></thead>
          <tbody>${c.groups.map(g => `<tr><td><b>${g.naam}</b><small>${g.wie}${g.k === "koppel" && c.own ? ` · ${eur2(g.gasten)} gasten + ${eur2(c.own)} enkel wij` : ""}</small></td><td class="num">${g.n}</td><td class="num">${eur2(g.bedrag)}</td></tr>`).join("")}</tbody>
          <tfoot><tr><td>Totaal</td><td class="num">${c.n}</td><td class="num">${eur2(c.groups.reduce((a, g) => a + g.bedrag, 0))}</td></tr></tfoot></table>
        <p class="meta" style="margin:0">${BG.basis === "uitgenodigd" ? "Alle gasten zonder afzegging, ook de optionele +1's." : "Enkel gasten die bevestigd hebben."} Kinderen tellen als volledige gast. Wie welke gast betaalt, volgt de relatie en de kant (Via) in Gasten.</p>
      </section>`;
  }
  function viewBudget(){
    if(PRIV.hide) return `
      <div class="panel-head"><h2>Budget</h2></div>
      <div class="empty hidden-budget"><p>Het budget is verborgen op dit toestel.</p><button class="btn" data-show-budget>Toon budget</button></div>`;
    const list = [...S.budget].sort((a,b) => budgetOrd(a) - budgetOrd(b));
    const est = sum(list, b => inclVat(b, b.geraamd)), real = sum(list, b => inclVat(b, b.werkelijk)), fixed = sum(list.filter(b => b.vastgelegd), b => inclVat(b, b.geraamd));
    const vatSel = b => `<select class="cell btw" ${attrs("budget", b.id, "btw", 'aria-label="Btw"')}>${[["","incl."],["21","excl. 21%"],["12","excl. 12%"],["6","excl. 6%"]].map(([v,l]) => `<option value="${v}"${String(b.btw||"")===v?" selected":""}>${l}</option>`).join("")}</select>`;
    const rows = list.map(b => {

      return `<tr data-row-id="${esc(b.id)}">
        <td style="width:30px"><button class="handle" data-handle="${esc(b.id)}" title="Sleep om te verplaatsen (of pijltjestoetsen)" aria-label="Verplaats ${esc(b.post)}"${dis()}>⋮⋮</button></td>
        <td><input class="cell" ${attrs("budget", b.id, "post", 'aria-label="Post"')} value="${esc(b.post)}"></td>
        <td class="w-money"><input class="cell num" inputmode="decimal" ${attrs("budget", b.id, "geraamd", 'data-t="money" aria-label="Geraamd"')} value="${esc(moneyIn(b.geraamd))}" placeholder="0"></td>
        <td class="w-money"><input class="cell num" inputmode="decimal" ${attrs("budget", b.id, "werkelijk", 'data-t="money" aria-label="Werkelijk"')} value="${esc(moneyIn(b.werkelijk))}" placeholder="—"></td>
        <td class="w-vat">${vatSel(b)}${vatRate(b) ? `<small class="vat-incl">incl. ${eur2(postCost(b))}</small>` : ""}</td>
        <td class="num" style="color:${diff===null?"var(--muted)":diff>0?"var(--warn)":"var(--ok)"}">${diff===null?"—":(diff>0?"+":"")+eur2(diff)}</td>
        <td class="c"><input type="checkbox" ${attrs("budget", b.id, "vastgelegd", 'data-t="bool" aria-label="Vastgelegd"')}${b.vastgelegd?" checked":""}></td>
        <td class="c"><input type="checkbox" ${attrs("budget", b.id, "eigen", 'data-t="bool" aria-label="Enkel wij (ouders betalen niet mee)"')}${isOwn(b)?" checked":""}></td>
        <td><input class="cell" ${attrs("budget", b.id, "opmerking", 'aria-label="Opmerking"')} value="${esc(b.opmerking)}" placeholder="—"></td>
        <td class="num">${delBtn("budget", b.id)}</td></tr>`;
    }).join("");
    return `
      <div class="panel-head"><h2>Budget</h2><span class="meta">Vastgelegd ${eur(fixed)} · nog open ${eur(est - fixed)} <button class="btn ghost hide-btn" data-hide-budget title="Verberg alle bedragen, bv. als je de app aan iemand toont">Verberg budget</button></span></div>
      ${list.length ? `<div class="scroll budget"><table>
        <thead><tr><th></th><th>Post</th><th class="num">Geraamd</th><th class="num">Werkelijk</th><th>Btw</th><th class="num">Verschil</th><th class="c">Vastgelegd</th><th class="c" title="Aangevinkt: kost is sowieso voor jullie. Niet aangevinkt: ouders betalen per gast mee.">Enkel wij</th><th>Opmerking</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td></td><td>Totaal incl. btw</td><td class="num">${eur2(est)}</td><td class="num">${real ? eur2(real) : "—"}</td><td></td><td></td><td></td><td></td><td colspan="2"></td></tr></tfoot>
        </table></div>${costCard()}` : `<div class="empty">Nog geen budgetposten. Voeg hierboven de eerste toe.</div>`}
      <form class="add" data-add="budget">
        <label class="grow">Post<input id="b-post" name="post" required placeholder="bv. Champagne"${dis()}></label>
        <label>Geraamd (€)<input id="b-geraamd" name="geraamd" inputmode="decimal" placeholder="0" style="width:120px"${dis()}></label>
        <button class="btn" type="submit"${dis()}>Post toevoegen</button>
      </form>`;
  }

  // ---------- taken ----------
  // Bevestiging bij het afvinken. Bij gewone taken kan je meteen kiezen wat er in het Overzicht komt.
  function confirmBox(t){
    const isCheck = t.categorie === CAT_CHECK;
    if(!CF || CF.id !== t.id) CF = { id: t.id, label: String(t.overzicht || ""), info: String(t.overzicht_info || "") || String(t.leverancier || "") };
    const label = CF.label, info = CF.info;
    return `<div class="confirm" role="group" aria-label="Bevestigen"><span>“${esc(t.titel)}” ${isCheck ? "als gecheckt aanduiden?" : "markeren als gedaan?"}</span>
      ${isCheck ? "" : `<div class="ov-fields"><label>In het overzicht als<input id="ovl-${esc(t.id)}" value="${esc(label)}" placeholder="bv. Fotograaf · leeg = niet tonen"></label><label>Info<input id="ovi-${esc(t.id)}" value="${esc(info)}" placeholder="bv. naam, datum, contact"></label></div>`}
      <button class="btn" data-confirm-done="${esc(t.id)}">${isCheck ? "Ja, gecheckt" : "Ja, gedaan"}</button><button class="chip-btn" data-confirm-cancel>Annuleer</button></div>`;
  }
  // ---------- agenda (bovenaan Taken): week per week de taken met een uiterste datum en de afspraken ----------
  const AG = { start: 0, open: null };
  const pad2 = n => String(n).padStart(2, "0");
  const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
  const dayLabel = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("nl-BE", { weekday:"short", day:"numeric", month:"numeric" }); };
  const shortDay = d => d.toLocaleDateString("nl-BE", { day:"numeric", month:"short" });
  const timeKey = u => { const m = /(\d{1,2})\s*[u:h.]?\s*(\d{2})?/.exec(String(u || "")); return m ? pad2(m[1]) + (m[2] || "00") : "9999"; };
  const MIJLPALEN = { "2027-07-03": "Burgerlijke trouw", "2027-07-10": "Trouwfeest" };
  const WEEKS = 4;
  function viewAgenda(){
    const notReady = db && db.has && !db.has("events");
    const m0 = addDays(mondayOf(today()), AG.start * 7), thisMonday = isoOf(mondayOf(today()));
    const tasks = S.tasks.filter(t => t.categorie !== CAT_CHECK && /^\d{4}-\d{2}-\d{2}/.test(String(t.deadline || "")));
    const evs = S.events.filter(e => /^\d{4}-\d{2}-\d{2}/.test(String(e.datum || "")));
    const whoL = w => w === "louis" ? "Louis" : w === "partner" ? partnerLabel() : "samen";
    const evRow = e => `<details class="ag-item ag-ev"${AG.open === e.id ? " open" : ""} data-ag-id="${esc(e.id)}">
        <summary><span class="ag-day">${esc(dayLabel(e.datum.slice(0,10)))}</span><span class="ag-time">${esc(e.uur || "")}</span><span class="ag-what"><b>${esc(e.titel || "Afspraak")}</b>${e.waar ? `<small>${esc(e.waar)}</small>` : ""}</span><span class="tag ag-tag">Afspraak</span></summary>
        <div class="ag-edit">
          <label>Datum<input class="cell" type="date" ${attrs("events", e.id, "datum", 'aria-label="Datum"')} value="${esc(e.datum.slice(0,10))}"></label>
          <label>Uur<input class="cell" ${attrs("events", e.id, "uur", 'aria-label="Uur"')} value="${esc(e.uur || "")}" placeholder="bv. 14u00"></label>
          <label class="grow">Wat<input class="cell" ${attrs("events", e.id, "titel", 'aria-label="Wat"')} value="${esc(e.titel || "")}"></label>
          <label class="grow">Waar / met wie<input class="cell" ${attrs("events", e.id, "waar", 'aria-label="Waar"')} value="${esc(e.waar || "")}" placeholder="—"></label>
          <label class="full">Notitie<textarea class="cell auto" rows="1" ${attrs("events", e.id, "notitie", 'aria-label="Notitie"')} placeholder="—">${esc(e.notitie || "")}</textarea></label>
          <div>${delBtn("events", e.id)}</div>
        </div></details>`;
    const taskRow = (t, late) => `<div class="ag-item ag-task${t.done ? " done" : ""}${late ? " late" : ""}"><span class="ag-day">${esc(dayLabel(t.deadline.slice(0,10)))}</span><span class="ag-time"></span><span class="ag-what"><b>${esc(t.titel)}</b><small>${esc(whoL(t.wie))}${t.leverancier ? " · " + esc(t.leverancier) : ""}</small></span><span class="tag ${t.done ? "ok" : late ? "late" : "soon"}">${t.done ? "Gedaan" : late ? "Te laat" : "Taak"}</span></div>`;
    const weeks = [];
    for(let i = 0; i < WEEKS; i++){
      const from = addDays(m0, i * 7), to = addDays(from, 6), a = isoOf(from), b = isoOf(to);
      const inW = iso => iso >= a && iso <= b;
      const es = evs.filter(e => inW(e.datum.slice(0,10))).map(e => ({ k: e.datum.slice(0,10) + "0" + timeKey(e.uur), h: evRow(e) }));
      const ts = tasks.filter(t => inW(t.deadline.slice(0,10))).map(t => ({ k: t.deadline.slice(0,10) + "1", h: taskRow(t, !t.done && daysUntil(t.deadline) < 0) }));
      const late = a === thisMonday ? tasks.filter(t => !t.done && t.deadline.slice(0,10) < a).sort((x,y) => x.deadline.localeCompare(y.deadline)) : [];
      const marks = Object.keys(MIJLPALEN).filter(inW).map(k => `<span class="tag ag-mijl">${esc(MIJLPALEN[k])} · ${esc(dayLabel(k))}</span>`).join("");
      const rows = [...es, ...ts].sort((x,y) => x.k.localeCompare(y.k)).map(x => x.h).join("");
      weeks.push(`<div class="ag-week${a === thisMonday ? " now" : ""}">
          <div class="ag-wh"><b>Week ${isoWeek(from)}</b><span>${esc(shortDay(from))} – ${esc(shortDay(to))}</span>${a === thisMonday ? `<span class="tag ag-now">Deze week</span>` : ""}${marks}</div>
          ${late.length ? `<div class="ag-late"><span class="ag-sub">Nog open van vroeger · ${late.length}</span>${late.map(t => taskRow(t, true)).join("")}</div>` : ""}
          ${rows || (late.length ? "" : `<div class="ag-empty">Niets gepland.</div>`)}
        </div>`);
    }
    const toWed = Math.round((WEDDING - mondayOf(today())) / (7 * 864e5));
    return `<section class="agenda">
        <div class="ag-head"><div><h3>Agenda</h3><span class="meta">Week per week: taken met een uiterste datum en jullie afspraken${toWed > 0 ? ` · nog ${toWed} weken tot 10 juli` : ""}</span></div>
