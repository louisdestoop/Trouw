        </form>
        <div class="ag-weeks">${weeks.join("")}</div>
      </section>`;
  }

  function viewTasks(){
    const cats = [...new Set(S.tasks.map(t => t.categorie).filter(Boolean))].sort((a,b) => a.localeCompare(b, "nl"));
    // Open "Te checken"-punten staan in een eigen lijstje bovenaan, niet tussen de maanden.
    let list = S.tasks.filter(t => (F.taskView === "alle" || (F.taskView === "gedaan" ? t.done : !t.done)) && (!F.taskCat || t.categorie === F.taskCat) && !(t.categorie === CAT_CHECK && !t.done));
    const checks = S.tasks.filter(t => t.categorie === CAT_CHECK && !t.done).sort((a,b) => (Number(a.created)||0) - (Number(b.created)||0));
    const showChecks = F.taskView !== "gedaan" && (!F.taskCat || F.taskCat === CAT_CHECK);
    sortTasks(list);
    const canDrag = S.canWrite && F.taskView === "open" && !F.taskCat;
    const who = w => `<option value="louis"${w==="louis"?" selected":""}>Louis</option><option value="partner"${w==="partner"?" selected":""}>${esc(partnerLabel())}</option><option value="samen"${(!w||w==="samen")?" selected":""}>Samen</option>`;
    const prioSel = (t) => `<select class="cell" ${attrs("tasks", t.id, "prioriteit", 'aria-label="Prioriteit"')}>${[["","—"],["urgent","Urgent"],["hoog","Hoog"],["middel","Middel"]].map(([v,l]) => `<option value="${v}"${(t.prioriteit||"")===v?" selected":""}>${l}</option>`).join("")}</select>`;
    let lastMonth = null;
    const items = list.map(t => {
      const d = daysUntil(t.deadline);
      let flag = "";
      if(t.done) flag = `<span class="tag ok">Gedaan</span>`;
      else if(d !== null && d < 0) flag = `<span class="tag late">${-d} d te laat</span>`;
      else if(d !== null && d <= 30) flag = `<span class="tag soon">nog ${d} d</span>`;
      if(!t.done && t.prioriteit) flag += `<span class="tag ${t.prioriteit}">${t.prioriteit[0].toUpperCase()+t.prioriteit.slice(1)}</span>`;
      const sub = [t.categorie ? `<span class="cat">${esc(t.categorie)}</span>` : "", t.leverancier ? esc(t.leverancier) : "", t.opmerking ? esc(t.opmerking) : ""].filter(Boolean).join("<span aria-hidden=\"true\">·</span>");
      let head = "";
      if(!t.done && F.taskView !== "gedaan"){
        const m = t.deadline ? new Date(t.deadline).toLocaleDateString("nl-BE",{month:"long",year:"numeric"}) : "Zonder datum";
        if(m !== lastMonth){ head = `<div class="group-h" data-month="${t.deadline ? esc(t.deadline.slice(0,7)) : ""}">${esc(m)}</div>`; lastMonth = m; }
      } else if(t.done && lastMonth !== "__done"){ head = `<div class="group-h" data-month="__done">Gedaan</div>`; lastMonth = "__done"; }
      const handleOk = canDrag && !t.done;
      return `${head}<div class="task${t.done?" done":""}"${t.done ? "" : ` data-row-id="${esc(t.id)}"`}>
        <button class="handle" data-handle="${esc(t.id)}" data-kind="task" title="${handleOk ? "Sleep naar een andere plaats of maand" : "Slepen kan in 'Te doen' zonder categoriefilter"}" aria-label="Verplaats ${esc(t.titel)}"${handleOk ? "" : " disabled"}>⋮⋮</button>
        <input type="checkbox" ${attrs("tasks", t.id, "done", 'data-t="bool" aria-label="Gedaan"')}${t.done?" checked":""}>
        <div class="main"><input class="cell title" ${attrs("tasks", t.id, "titel", 'aria-label="Taak"')} value="${esc(t.titel)}">${sub ? `<div class="sub">${sub}</div>` : ""}</div>
        <input class="cell" type="date" ${attrs("tasks", t.id, "deadline", 'aria-label="Uiterste datum"')} value="${esc(t.deadline||"")}">
        <select class="cell" ${attrs("tasks", t.id, "wie", 'aria-label="Wie"')}>${who(t.wie)}</select>
        <div class="flags">${flag}</div>
        ${delBtn("tasks", t.id)}
        ${confirmDone === t.id ? confirmBox(t) : ""}</div>`;
    }).join("");
    const checkRows = checks.map(t => `<div class="task check-row">
        <input type="checkbox" ${attrs("tasks", t.id, "done", 'data-t="bool" aria-label="Gecheckt"')}>
        <div class="main"><textarea class="cell title auto" rows="1" ${attrs("tasks", t.id, "titel", 'aria-label="Te checken"')}>${esc(t.titel)}</textarea>${t.opmerking ? `<div class="sub">${esc(t.opmerking)}</div>` : ""}</div>
        ${delBtn("tasks", t.id)}
        ${confirmDone === t.id ? confirmBox(t) : ""}</div>`).join("");
    const checkBlock = showChecks ? `<section class="checks">
        <h3>Te checken <span>${checks.length}</span></h3>
        ${checks.length ? `<div class="tasks">${checkRows}</div>` : `<p class="meta" style="margin:0">Niets meer te checken.</p>`}
        <form class="add-inline" data-add="check"><input name="titel" required placeholder="Iets te checken toevoegen…" aria-label="Iets te checken toevoegen"${dis()}><button class="btn" type="submit"${dis()}>Toevoegen</button></form>
      </section>` : "";
    const cnt = { open: S.tasks.filter(t=>!t.done).length, gedaan: S.tasks.filter(t=>t.done).length, alle: S.tasks.length };
    const chip = (k, l) => `<button class="chip-btn" data-tview="${k}" aria-pressed="${F.taskView===k}">${l} ${cnt[k]}</button>`;
    return `
      <div class="panel-head"><h2>Taken</h2></div>
      ${viewAgenda()}
      <div class="toolbar">
        <div class="chips">${chip("open","Te doen")}${chip("gedaan","Gedaan")}${chip("alle","Alle")}</div>
        <select id="t-cat-filter" class="search" style="flex:0 1 220px" aria-label="Filter op categorie"><option value="">Alle categorieën</option>${cats.map(c => `<option${F.taskCat===c?" selected":""}>${esc(c)}</option>`).join("")}</select>
      </div>
      ${checkBlock}
      ${list.length ? `<div class="tasks">${items}</div>` : `<div class="empty">Geen taken in deze weergave.</div>`}

        <label class="grow">Taak<input id="t-titel" name="titel" required placeholder="bv. Champagne bestellen"${dis()}></label>
        <label>Categorie<input id="t-categorie" name="categorie" list="t-cats" style="width:150px"${dis()}></label>

        <label>Uiterste datum<input id="t-deadline" name="deadline" type="date"${dis()}></label>
        <label>Wie<select id="t-wie" name="wie"${dis()}>${who("samen")}</select></label>
        <button class="btn" type="submit"${dis()}>Taak toevoegen</button>
      </form>`;
  }

  };
  const FM = { temp:"alle", vtemp:"alle" };

  const menuKey = (gang, g) => gang + "\u0001" + g;
  function menuPicks(){
    const seen = new Set(), by = {};
    Object.keys(GANG).forEach(k => by[k] = []);
    S.menu.filter(m => !m.soort).sort((a,b) => (Number(a.created)||0) - (Number(b.created)||0)).forEach(m => {
      const k = menuKey(m.gang, m.gerecht);
      if(!by[m.gang] || seen.has(k)) return;
      seen.add(k); by[m.gang].push(m);
    });
    return by;
  }
  const menuOpen = () => { const p = menuPicks(); return Object.keys(GANG).reduce((n, k) => n + (GANG[k].verplicht ? Math.max(0, GANG[k].kies - p[k].length) : 0), 0); };
  function toggleDish(gang, gerecht, groep){
    if(!S.canWrite) return;
    if(db && db.has && !db.has("menu")){ toast("Werk eerst het script (Code.gs) bij, dan kan je dit bewaren."); return; }
    const picks = menuPicks()[gang], cfg = GANG[gang];
    const same = S.menu.filter(m => !m.soort && m.gang === gang && m.gerecht === gerecht);
    if(same.length){ same.forEach(m => remove("menu", m.id)); return; }
    if(cfg.kies === 1) S.menu.filter(m => !m.soort && m.gang === gang).forEach(m => remove("menu", m.id));
    else if(cfg.kies > 1 && picks.length >= cfg.kies){ toast(`Je koos al ${cfg.kies} ${cfg.titel.toLowerCase()}. Haal er eerst één weg.`); return; }
    add("menu", { gang, gerecht, groep: groep || "" });

    if(!S.canWrite || !tekst) return;

    tekst = tekst.replace(/\s*\|\s*/g, " | ");
    if(voorstellen(gang).some(v => v.gerecht.toLowerCase() === tekst.toLowerCase())){ toast("Dat voorstel staat er al."); return; }
    add("menu", { gang, gerecht: tekst, groep: "Eigen voorstel", soort: "voorstel" });
    const cfg = GANG[gang], n = menuPicks()[gang].length;
    if(!cfg.kies || n < cfg.kies) add("menu", { gang, gerecht: tekst, groep: "Eigen voorstel" });
  }
  function removeVoorstel(id){

  // Dranken: rijen met gang "drank", soort "drank", groep = moment (Apero, Diner, Dansfeest, Algemeen), gerecht = drank, opmerking = details.
  const DRANK_BLOKKEN = [

  const dranken = blok => S.menu.filter(m => m.soort === "drank" && m.groep === blok).sort((a,b) => (Number(a.created)||0) - (Number(b.created)||0));
  function menuText(){
    const p = menuPicks(), lbl = m => dishText(m.gerecht) + (m.groep === "Eigen voorstel" ? " (eigen voorstel, te bespreken)" : ""), list = k => p[k].map(lbl);

    const lines = ["Menu Florence & Louis · 10 juli 2027", ""];
    lines.push(`Hapjes (${p.hapje.length}/6):`); list("hapje").forEach(x => lines.push("- " + x));
    lines.push("", "Voorgerecht: " + one("voorgerecht"), "", "Hoofdgerecht:");
    lines.push(`- Vlees: ${one("vlees")}${p.saus[0] ? ", saus " + lbl(p.saus[0]) : ""}${p.side[0] ? ", " + lbl(p.side[0]) : ""}`);
    lines.push("- Vis: " + one("vis"), "- Veggie: " + one("veggie"), "- Groenten: zomergroentjes van het seizoen");
    lines.push("", `Mini-desserts om te delen (${p.dessert.length}/4):`); list("dessert").forEach(x => lines.push("- " + x));

  function viewMenu(){
    const p = menuPicks(), notReady = db && db.has && !db.has("menu");

    const dish = (gang, s, groep) => {

    const groups = (gang, filter) => MENU_KAART[gang].filter(g => !filter || filter === "alle" || g.temp === filter).map(g => {

        <form class="add-inline mvoor" data-voorstel="${esc(gang)}"><input name="tekst" placeholder="Zelf iets voorstellen om te bespreken met de cateraar…" aria-label="Eigen voorstel ${esc(GANG[gang].titel)}"${dis()}><button class="btn ghost" type="submit"${dis()}>Toevoegen</button></form></div>`;

    const tchip = (key, v, l) => `<button class="chip-btn" data-mtemp="${key}:${v}" aria-pressed="${FM[key] === v}">${l}</button>`;
    const sec = (id, k, intro, body, chips) => `<section class="msec" id="m-${id}"><div class="msec-head"><h3>${esc(GANG[k].titel)}</h3>${count(k)}</div>${intro ? `<p class="meta">${intro}</p>` : ""}${chips ? `<div class="chips">${chips}</div>` : ""}${body}${eigen(k)}</section>`;
    const sum = (label, k, extra) => {

        ${sum("Voorgerecht", "voorgerecht")}
        ${sum("Vlees", "vlees")}${sum("Saus", "saus")}${sum("Side", "side")}
        ${sum("Vis", "vis")}${sum("Veggie", "veggie")}
        <div class="mline"><span class="ml">Groenten</span><span class="mv"><span>Zomergroentjes van het seizoen</span></span></div>
        ${sum(`Desserts ${p.dessert.length}/4`, "dessert")}
        ${p.extra.length ? sum("Extra's", "extra") : ""}
        ${DRANK_BLOKKEN.map(b => { const ds = dranken(b.k); return ds.length ? `<div class="mline"><span class="ml">${b.k}</span><span class="mv"><span>${ds.map(d => esc(d.gerecht)).join(", ")}</span></span></div>` : ""; }).join("")}
        <label class="mnote">Opmerking voor de cateraar<textarea class="auto" rows="2" data-setting="menu_opmerking" placeholder="bv. glutenvrije optie, kindermenu …"${dis()}>${esc(S.settings.menu_opmerking || "")}</textarea></label>

      <div class="panel-head"><h2>Menu</h2><span class="meta">Ma Kwizien · brochure 2026 · tik een gerecht aan om het te kiezen</span></div>
      ${notReady ? `<div class="notice">Het script kent dit tabblad nog niet. Plak de nieuwste Code.gs en implementeer een nieuwe versie.</div>` : ""}
      <div class="mlayout">
        ${summary}
        <div class="mmain">
          ${sec("hapjes", "hapje", "Kies 6 hapjes voor de receptie, koud of warm.", groups("hapje", FM.temp), tchip("temp", "alle", "Alle") + tchip("temp", "koud", "Koud") + tchip("temp", "warm", "Warm") + tchip("temp", "exquis", "Exquis"))}
          ${sec("voorgerecht", "voorgerecht", "Kies 1 voorgerecht, koud of warm.", groups("voorgerecht", FM.vtemp), tchip("vtemp", "alle", "Alle") + tchip("vtemp", "koud", "Koud") + tchip("vtemp", "warm", "Warm"))}
          <h3 class="mtitle">Hoofdgerecht</h3>
          <p class="meta mtitle-sub">Kies 1 gerecht per soort: de gasten kiezen op de antwoordpagina tussen vlees, vis en vegetarisch. Bij het vlees kies je ook een saus en een side. De groenten zijn seizoensgebonden; in juli zijn dat zomergroentjes (mangetouts, courgette, bloemkool, champignons …).</p>
          ${sec("vlees", "vlees", "", groups("vlees"))}
          ${sec("saus", "saus", "", groups("saus"))}
          ${sec("side", "side", "", groups("side"))}
          ${sec("vis", "vis", "", groups("vis"))}
          ${sec("veggie", "veggie", "Vegetarisch of vegan.", groups("veggie"))}
          ${sec("dessert", "dessert", "Kies 4 mini-desserts om te delen op tafel. Dessert en koffie zitten in de offerte.", groups("dessert"))}

        </div>

  }

  // ---------- vragen per leverancier ----------
  const FQ = { view:"open", lev:"", lastLev:"" };
  function viewQuestions(){

    const known = [...new Set(levs.concat(S.tasks.map(t => String(t.leverancier || "").trim()).filter(Boolean)))].sort((a,b) => a.localeCompare(b, "nl"));

  // ---------- tafels (bovenaanzicht) ----------
  const T = { sel:null, placing:null, moving:null, q:"" };
  const sheet = document.getElementById("sheet");
  function seatMap(){
    const tables = [...S.tables].sort((a,b) => (a.created||0)-(b.created||0));
    const byId = Object.fromEntries(tables.map(t => [t.id, t]));
    const coming = S.guests.filter(g => g.status !== "nee").sort((a,b) => guestRank(a) - guestRank(b));
    const map = {}, placed = new Set();
    coming.forEach(g => {
      const t = byId[g.tafel]; if(!t || typeof g.plaats !== "number") return;
      if(g.plaats < 0 || g.plaats >= (Number(t.plaatsen)||0)) return;
      const k = g.tafel + ":" + g.plaats; if(map[k]) return;
      map[k] = g; placed.add(g.id);
    });
    return { tables, map, coming, unplaced: coming.filter(g => !placed.has(g.id)) };
  }
  const firstName = g => g.voornaam || gname(g);
  function viewTables(){
    const { tables, map, coming, unplaced } = seatMap();
    const seated = Object.values(map);
    const seatsTotal = sum(tables, t => t.plaatsen);
    const cards = tables.map(t => {
      const n = Math.max(0, Number(t.plaatsen)||0), rows = Math.max(1, Math.ceil(n/2));
      let seats = "", occ = 0, def = 0;
      for(let i = 0; i < n; i++){
        const g = map[t.id + ":" + i];
        if(g){ occ++; if(g.definitief) def++; }
        const cls = g ? (g.definitief ? "ok" : "wait") : "free";
        const sel = T.sel && T.sel.t === t.id && T.sel.i === i ? " sel" : "";
        const desc = g ? `${gname(g)}, ${g.definitief ? "definitief" : "voorlopig"}` : "vrij";
        seats += `<button class="seat ${cls}${sel}" style="grid-column:${i % 2 ? 3 : 1};grid-row:${Math.floor(i/2) + 1}" data-spot="${esc(t.id)}:${i}" title="${esc(g ? gname(g) : "Vrije plaats")} · plaats ${i+1}" aria-label="${esc(t.naam || "Tafel")}, plaats ${i+1}: ${esc(desc)}">${esc(g ? firstName(g) : "vrij")}</button>`;
      }
      return `<section class="tplan">
        <div class="thead"><input class="cell tname" ${attrs("tables", t.id, "naam", 'aria-label="Naam tafel"')} value="${esc(t.naam)}"></div>
        <div class="tgrid">${seats}<div class="tbl" style="grid-row:1 / span ${rows}" aria-hidden="true"><span>${esc(t.naam || "Tafel")}</span></div></div>
        <div class="counter">
          <button data-cap="${esc(t.id)}" data-d="-1" aria-label="Eén plaats minder aan ${esc(t.naam)}"${dis()}>−</button>
          <div class="cnt"><b>${n}</b><small>plaatsen</small></div>
          <button data-cap="${esc(t.id)}" data-d="1" aria-label="Eén plaats meer aan ${esc(t.naam)}"${dis()}>+</button>
        </div>
        <div class="tmeta">${occ} bezet · ${def} definitief · ${n - occ} vrij</div>
      </section>`;
    }).join("");
    return `
      <div class="panel-head"><h2>Tafelschikking</h2><span class="meta">${seatsTotal} plaatsen · ${seated.length} bezet (${seated.filter(g => g.definitief).length} definitief) · ${coming.length} gasten zonder afzeggingen</span></div>
      <div class="legend"><span><i style="background:var(--seat-ok)"></i>Definitief</span><span><i style="background:var(--seat-wait)"></i>Kan nog verplaatsen</span><span><i style="background:var(--seat-free);border:1px solid var(--seat-free-line)"></i>Vrije plaats</span><span>Tik op een plaats om iemand te zetten, te verplaatsen of definitief te maken.</span></div>
      ${coming.length ? `<div class="unplaced"><h3>Nog geen plaats · ${unplaced.length} gasten</h3>
        ${unplaced.length ? `<div class="pills">${unplaced.map(g => `<button class="pill" data-place-guest="${esc(g.id)}" aria-pressed="${T.placing === g.id}"${dis()}>${esc(gname(g))}</button>`).join("")}</div>` : `<span class="meta">Iedereen heeft een plaats.</span>`}</div>` : ""}
      ${tables.length ? `<div class="plan">${cards}</div>` : `<div class="empty">De tafels worden geladen…</div>`}`;
  }
  function refreshTables(){ if(currentTab() === "tafels" && !isEditing()) renderTab(); renderSheet(); }
  function clearTableState(){ T.sel = null; T.placing = null; T.moving = null; T.q = ""; }
  function onSpot(key){
    const [t, iS] = key.split(":"), i = Number(iS);
    const { map } = seatMap(), g = map[key];
    if(!S.canWrite){ T.sel = { t, i }; refreshTables(); return; }
    if(T.placing){
      if(g){ toast("Deze plaats is al bezet. Kies een vrije (rode) plaats."); return; }
      write("guests", T.placing, { tafel: t, plaats: i, definitief: false });
      T.placing = null; T.sel = { t, i }; refreshTables(); return;
    }
    if(T.moving){

        toast(g ? `${firstName(mg)} en ${firstName(g)} zijn van plaats gewisseld` : `${firstName(mg)} is verplaatst`);
      }
      T.sel = { t, i }; refreshTables(); return;
    }
    T.sel = (T.sel && T.sel.t === t && T.sel.i === i) ? null : { t, i }; T.q = "";
    refreshTables();
  }
  function renderSheet(listOnly){
    if(currentTab() === "uitnodigingen" && S.dbOk && A.h){ if(!sheet.querySelector("#addr-form")) renderAddrSheet(); return; }
    if(currentTab() === "uitnodigingen" && S.dbOk && J.h){ renderJoinSheet(listOnly); return; }
    const show = currentTab() === "tafels" && S.dbOk && (T.sel || T.placing || T.moving);

    const { tables, map, unplaced } = seatMap();
    if(T.placing || T.moving){
      const g = S.guests.find(x => x.id === (T.placing || T.moving));
      if(!g){ clearTableState(); renderSheet(); return; }
      sheet.innerHTML = `<div class="sheet-h"><h3>${T.placing ? "Plaats kiezen" : "Verplaatsen"}</h3><button class="del" data-sheet-close>Annuleer</button></div>
        <p class="meta">${T.placing ? `Tik op een vrije (rode) plaats voor <b>${esc(gname(g))}</b>.` : `Tik op de nieuwe plaats voor <b>${esc(gname(g))}</b>. Is die bezet, dan wisselen de twee gasten van plaats.`}</p>`;
      return;
    }
    const t = tables.find(x => x.id === T.sel.t);
    if(!t || T.sel.i >= (Number(t.plaatsen)||0)){ clearTableState(); renderSheet(); return; }
    const g = map[T.sel.t + ":" + T.sel.i];
    const title = `${esc(t.naam || "Tafel")} · plaats ${T.sel.i + 1}`;
    if(g){
      sheet.innerHTML = `<div class="sheet-h"><h3>${title}</h3><button class="del" data-sheet-close>Sluiten</button></div>
        <p><b>${esc(gname(g))}</b> <span class="tag ${g.definitief ? "ok" : "soon"}">${g.definitief ? "Definitief" : "Kan nog verplaatsen"}</span></p>
        <div class="acts"><button class="btn" data-sheet-def${dis()}>${g.definitief ? "Maak voorlopig" : "Maak definitief"}</button><button class="btn ghost" data-sheet-move${dis()}>Verplaatsen</button><button class="btn ghost" data-sheet-unseat${dis()}>Van tafel halen</button></div>`;
      return;
    }
    const q = T.q.trim().toLowerCase();
    const list = unplaced.filter(x => !q || gname(x).toLowerCase().includes(q));
    const listHtml = list.length ? list.map(x => `<button data-sheet-pick="${esc(x.id)}"${dis()}><span>${esc(gname(x))}</span><small>${x.via === "florence" ? "F" : "L"} · ${esc(x.relatie || "")}</small></button>`).join("")
      : `<p class="meta" style="padding:10px 12px">${unplaced.length ? "Geen gast gevonden." : "Iedereen heeft al een plaats."}</p>`;
    if(listOnly){ const gl = sheet.querySelector(".glist"); if(gl){ gl.innerHTML = listHtml; return; } }
    sheet.innerHTML = `<div class="sheet-h"><h3>${title} <span class="meta">· vrij</span></h3><button class="del" data-sheet-close>Sluiten</button></div>
      <input id="sheet-q" class="search" style="max-width:none" type="search" placeholder="Zoek een gast zonder plaats (${unplaced.length})" value="${esc(T.q)}" aria-label="Zoek gast"${dis()}>
      <div class="glist">${listHtml}</div>`;
  }
  sheet.addEventListener("input", e => { if(e.target.id === "sheet-q"){ T.q = e.target.value; renderSheet(true); } if(e.target.id === "join-q"){ J.q = e.target.value; renderSheet(true); } });
  sheet.addEventListener("click", e => {
    if(e.target.closest("[data-sheet-close]")){ clearTableState(); J.h = null; J.q = ""; A.h = null; sheet.innerHTML = ""; renderSheet(); return; }
    const sg = e.target.closest("[data-addr-use]");
    if(sg){ const p = parseAddr(sg.dataset.addrUse); const f = document.getElementById("addr-form"); if(p && f){ f.straat.value = p.straat; f.postcode.value = p.postcode; f.gemeente.value = p.gemeente; } return; }
    if(e.target.closest("[data-addr-clear]") && A.h){ write("households", A.h, { adres_straat: "", adres_postcode: "", adres_gemeente: "", adres_land: "" }); toast("Adres gewist"); A.h = null; sheet.innerHTML = ""; renderSheet(); renderTab(); return; }
    const jp = e.target.closest("[data-join-pick]");
    if(jp && J.h){ joinHousehold(jp.dataset.joinPick, J.h); return; }
    const g = T.sel && seatMap().map[T.sel.t + ":" + T.sel.i];
    if(e.target.closest("[data-sheet-def]") && g){ write("guests", g.id, { definitief: !g.definitief }); return; }
    if(e.target.closest("[data-sheet-move]") && g){ T.moving = g.id; T.sel = null; refreshTables(); return; }
    if(e.target.closest("[data-sheet-unseat]") && g){ write("guests", g.id, { tafel: "", plaats: null, definitief: false }); toast(`${firstName(g)} heeft geen plaats meer`); return; }
    const pk = e.target.closest("[data-sheet-pick]");
    if(pk && T.sel){ write("guests", pk.dataset.sheetPick, { tafel: T.sel.t, plaats: T.sel.i, definitief: false }); T.q = ""; }
  });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && (T.sel || T.placing || T.moving || J.h || A.h)){ clearTableState(); J.h = null; A.h = null; sheet.innerHTML = ""; refreshTables(); } });

  function viewTablesOld(){
    const tables = [...S.tables].sort((a,b) => (a.created||0)-(b.created||0));
    const ids = new Set(tables.map(t => t.id));
    const coming = S.guests.filter(g => g.status !== "nee").sort((a,b) => guestRank(a) - guestRank(b));
    const unplaced = coming.filter(g => !g.tafel || !ids.has(g.tafel));
    const seatsTotal = sum(tables, t => t.plaatsen);
    const opts = `<option value="">+ Gast aan deze tafel zetten…</option>` + unplaced.map(g => `<option value="${esc(g.id)}">${esc(gname(g))}</option>`).join("");
    const cards = tables.map(t => {
      const seated = coming.filter(g => g.tafel === t.id), cap = Number(t.plaatsen)||0, n = seated.length;
      return `<div class="table-card">
        <div class="row"><input class="cell tname" ${attrs("tables", t.id, "naam", 'aria-label="Naam tafel"')} value="${esc(t.naam)}">
          <label class="seats"><input class="cell num" type="number" min="1" max="40" ${attrs("tables", t.id, "plaatsen", 'data-t="int" aria-label="Aantal plaatsen"')} value="${esc(cap)}"> pl.</label></div>
        <div class="cap${n>cap?" over":""}"><span>${n} / ${cap} bezet</span><span>${n>cap?`${n-cap} te veel`:`${cap-n} vrij`}</span></div>
        <div class="bar${n>cap?" over":""}"><span style="width:${cap?Math.min(100,n/cap*100):0}%"></span></div>
        ${seated.length ? `<ul class="seated">${seated.map(g => `<li><span>${esc(gname(g))}</span><button class="x" data-unseat="${esc(g.id)}" aria-label="Van tafel halen"${dis()}>×</button></li>`).join("")}</ul>` : ""}
        ${unplaced.length ? `<select data-seat="${esc(t.id)}" aria-label="Gast aan tafel zetten"${dis()}>${opts}</select>` : ""}
        <div>${delBtn("tables", t.id)}</div></div>`;
    }).join("");
    return `
      <div class="panel-head"><h2>Tafelschikking</h2><span class="meta">${seatsTotal} plaatsen voor ${coming.length} gasten (zonder afzeggingen, met optionele +1)</span></div>
      <form class="add" data-add="tables">
        <label class="grow">Naam tafel<input id="tb-naam" name="naam" required placeholder="bv. Tafel 1 of Eretafel"${dis()}></label>
        <label>Plaatsen<input id="tb-plaatsen" name="plaatsen" type="number" min="1" max="40" value="10" style="width:80px"${dis()}></label>
        <button class="btn" type="submit"${dis()}>Tafel toevoegen</button>
      </form>
      ${coming.length ? `<div class="unplaced"><h3>Nog niet geplaatst · ${unplaced.length} gasten</h3>
        ${unplaced.length ? `<div class="pills">${unplaced.map(g => `<span class="pill">${esc(gname(g))}</span>`).join("")}</div>` : `<span class="meta">Iedereen heeft een plaats.</span>`}</div>` : ""}
      ${tables.length ? `<div class="tables">${cards}</div>` : `<div class="empty">Nog geen tafels. Voeg hierboven een tafel toe en zet er gasten aan.</div>`}`;
  }

  // ---------- uitnodigingen ----------
  const FI = { q:"", filter:"alle", addr:"" };
  // Postadres per uitnodiging (gezin): kolommen adres_straat, adres_postcode, adres_gemeente, adres_land in Gezinnen.
  const A = { h:null };
  const hasAddr = h => !!(String(h.adres_straat || "").trim() && String(h.adres_gemeente || "").trim());
  const addrLine = h => [String(h.adres_straat || "").trim(), [h.adres_postcode, h.adres_gemeente].map(x => String(x || "").trim()).filter(Boolean).join(" "), String(h.adres_land || "").trim()].filter(Boolean).join(", ");
  const parseAddr = str => { const m = /^\s*(.+?),\s*(\d{4,5})\s+(.+?)\s*$/.exec(String(str || "")); return m ? { straat: m[1], postcode: m[2], gemeente: m[3] } : null; };
  const J = { h:null, q:"" };
  const SETTING_FIELDS = [
    ["site_url", "Webadres van de app", "url", "bv. https://www.florenceenlouis.be"],
    ["rsvp_deadline", "Antwoorden vóór", "date", ""],
    ["rsvp_welkom", "Welkomsttekst", "textarea", ""],
    ["rsvp_programma", "Programma (één moment per lijn)", "textarea", ""],
    ["rsvp_locatie", "Locatie", "text", ""],
    ["rsvp_dresscode", "Dresscode", "text", "nog te bepalen"],
    ["rsvp_extra", "Extra info voor gasten", "textarea", "bv. overnachting, cadeautip"],
    ["meldingen_email", "Stuur mij een mail bij elk antwoord", "email", "jouw e-mailadres"],
  ];
  // Code per gezin: 6 cijfers, niet beginnend met 0 (anders kan Google Sheets de 0 laten vallen).
  // Een tikfout (één cijfer fout of twee buren omgewisseld) mag nooit de code van een ander gezin opleveren,
  // en voor de hand liggende codes (123456, 111222, ...) worden overgeslagen.
  function codeOk(c, used){
    if(!/^[1-9]\d{5}$/.test(c) || new Set(c).size < 3) return false;
    const d = [...c].map(Number), steps = new Set(d.slice(1).map((x, i) => x - d[i]));
    if(steps.size === 1) return false;
    return !used.some(u => {
      if(u.length !== 6) return false;
      let diff = [];
      for(let i = 0; i < 6; i++) if(u[i] !== c[i]) diff.push(i);
      return diff.length < 2 || (diff.length === 2 && diff[1] === diff[0] + 1 && u[diff[0]] === c[diff[1]] && u[diff[1]] === c[diff[0]]);
    });
  }
  function newCode(){
    const used = S.households.map(h => String(h.code || "").trim());
    let c;
    do {
      const a = new Uint32Array(1); crypto.getRandomValues(a);
      c = String(100000 + a[0] % 900000);
    } while(!codeOk(c, used));
    return c;
  }
  const fmtCode = c => /^\d{6}$/.test(String(c)) ? String(c).slice(0, 3) + " " + String(c).slice(3) : String(c || "");
  function siteBase(){
    const s = String(S.settings.site_url || "").trim().replace(/\/+$/, "");
    return s || (location.origin + location.pathname.replace(/\/[^/]*$/, ""));
  }
  // Eén QR-code voor iedereen: die opent de antwoordpagina, waar elk gezin zijn code van 6 cijfers invult.
  const rsvpBase = () => `${siteBase()}/r/`;
  // Rechtstreekse link met code: enkel voor 'Bekijk als gast' in de planner.
  const rsvpLink = h => `${rsvpBase()}?c=${encodeURIComponent(h.code)}`;
  function qrSvg(text, margin){
    if(!window.qrcode) return "";
    const q = qrcode(0, "M"); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: margin == null ? 2 : margin, scalable: true }).replace(/fill="black"/g, 'fill="#7B1A50"');
  }
  const hname = id => { const h = S.households.find(x => x.id === id); return h ? h.naam : ""; };
  const isCouple = g => g.relatie === "Bruid" || g.relatie === "Bruidegom";
  function fmtStamp(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(String(s || ""));
    return m ? `${+m[3]}/${+m[2]}${m[4] ? ` om ${m[4]}u${m[5]}` : ""}` : String(s || "");
  }
  const STATUS_TXT = { ja:"komt", nee:"komt niet", open:"nog geen antwoord" };

  // Volgorde binnen een gezin: kolom gezin_volgorde (zelf versleept), anders het gastnummer.
  const memberRank = g => { const v = Number(g.gezin_volgorde); return g.gezin_volgorde !== "" && g.gezin_volgorde != null && isFinite(v) && v > 0 ? v : 1e6 + guestRank(g); };
  const memberOrder = (a, b) => memberRank(a) - memberRank(b) || guestRank(a) - guestRank(b);
  function saveMemberOrder(hid, ids){
    ids.forEach((id, i) => { const g = S.guests.find(x => x.id === id); if(g && Number(g.gezin_volgorde) !== i + 1) write("guests", id, { gezin_volgorde: i + 1 }); });
    renameHousehold(hid);
  }
  // Naam op de uitnodiging, afgeleid van de leden: "Jo & Nele Vanderbauwhede", "Ann Van Audenaerde & Filip Mussen", "Justien Mussen (+1)".
  const joinNames = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " & " + a[a.length - 1];
  function autoHouseholdName(members){
    const sorted = [...members].sort(memberOrder);
    const real = sorted.filter(g => !g.optioneel), plus = sorted.length > real.length;
    if(!real.length) return "";
    const sur = [...new Set(real.map(g => (g.achternaam || "").trim()))];
    const name = real.length === 1 ? gname(real[0])
      : sur.length === 1 && sur[0] ? joinNames(real.map(g => g.voornaam)) + " " + sur[0]
      : joinNames(real.map(gname));
    return name + (plus ? " (+1)" : "");
  }
  // De +1-rij van een gast ("+1 van Voornaam Achternaam") in hetzelfde gezin, of zonder gezin als de gast er ook geen heeft.
  const plusOneOf = g => S.guests.filter(x => x.optioneel && x.id !== g.id && (x.gezin || "") === (g.gezin || "") && x.voornaam === "+1 van " + gname(g));
  function renameHousehold(hid){
    const h = S.households.find(x => x.id === hid); if(!h) return "";
    const n = autoHouseholdName(S.guests.filter(g => g.gezin === hid));
    if(n && n !== h.naam) write("households", hid, { naam: n });
    return n || h.naam;
  }
  // Gast bij een ander gezin zetten: zijn +1 verhuist mee, de naam van beide gezinnen wordt bijgewerkt
  // en een oud gezin dat leeg wordt (en nog niet antwoordde) wordt verwijderd.
  function joinHousehold(gid, hid){
    const g = S.guests.find(x => x.id === gid); if(!g || g.gezin === hid) return;
    const old = g.gezin;
    [g, ...plusOneOf(g)].forEach(x => write("guests", x.id, { gezin: hid, gezin_volgorde: "" }));
    // Had het gezin al een eigen volgorde, dan komen de nieuwkomers achteraan.
    const ms = S.guests.filter(x => x.gezin === hid).sort(memberOrder);
    if(ms.some(x => memberRank(x) < 1e6)) ms.forEach((x, i) => { if(Number(x.gezin_volgorde) !== i + 1) write("guests", x.id, { gezin_volgorde: i + 1 }); });
    const newName = renameHousehold(hid);
    let msg = `${gname(g)} toegevoegd aan ${newName}`;
    if(old){
      const oh = S.households.find(x => x.id === old);
      if(oh && !S.guests.some(x => x.gezin === old)){
        if(invitesLocked()) msg += ` · "${oh.naam}" is nu leeg maar bleef bewaard omdat de uitnodigingen verstuurd zijn`;
        else if(oh.rsvp_op) msg += ` · "${oh.naam}" is nu leeg maar bleef bewaard omdat het al antwoordde`;
        else { remove("households", old); msg += ` · het oude gezin is verwijderd`; }
      } else if(oh) renameHousehold(old);
    }
    toast(msg);
  }

  function inviteCards(){
    const q = FI.q.trim().toLowerCase();
    const members = id => S.guests.filter(g => g.gezin === id).sort(memberOrder);
    const hs = [...S.households].sort((a,b) => (a.created||0) - (b.created||0)).filter(h =>
      (FI.filter === "alle" || (FI.filter === "ja" ? !!h.rsvp_op : !h.rsvp_op)) &&
      (!FI.addr || (FI.addr === "ja" ? hasAddr(h) : !hasAddr(h))) &&

    if(!hs.length) return `<div class="empty">${S.households.length ? "Geen gezinnen die aan deze filter voldoen." : "Nog geen gezinnen. Voeg hierboven het eerste toe."}</div>`;
    return `<div class="invs">${hs.map(h => {
      const ms = members(h.id), link = rsvpLink(h);
      return `<article class="inv">
        <div class="inv-top">
          <div class="inv-main">

            <div>${h.rsvp_op ? `<span class="tag ok">Geantwoord op ${esc(fmtStamp(h.rsvp_op))}</span>` : `<span class="tag quiet">Nog geen antwoord</span>`}</div>
            <div class="inv-acts">
              <button class="chip-btn" data-copy="${esc(String(h.code || ""))}" data-copy-what="Code">Code kopiëren</button>

            </div>
          </div>
          <div class="inv-code" title="Code van dit gezin"><small>Code</small><b>${esc(fmtCode(h.code))}</b></div>

        ${h.rsvp_bericht ? `<blockquote class="inv-msg">${esc(h.rsvp_bericht)}</blockquote>` : ""}
        ${ms.length ? `<ul class="inv-members">${ms.map(g => `<li data-row-id="${esc(g.id)}"><button class="handle" data-handle="${esc(g.id)}" data-kind="member" title="Sleep om de volgorde te wijzigen (of pijltjestoetsen)" aria-label="Verplaats ${esc(gname(g))}"${ms.length < 2 ? " disabled" : dis()}>⋮⋮</button><span class="dot ${esc(g.status || "open")}" title="${STATUS_TXT[g.status || "open"] || ""}"></span><span class="nm" title="${esc(STATUS_TXT[g.status || "open"] || "")}">${esc(gname(g))}</span>${g.kind ? '<span class="tag opt">kind</span>' : ""}${isOpt(g) ? '<span class="tag opt">+1</span>' : ""}<button class="x" data-split="${esc(g.id)}" title="Uit dit gezin halen" aria-label="${esc(gname(g))} uit dit gezin halen"${dis()}>×</button></li>`).join("")}</ul>` : `<p class="meta" style="margin:0">Nog niemand in dit gezin.</p>`}
        <div class="inv-foot"><button class="chip-btn" data-join-open="${esc(h.id)}"${dis()}>+ Gast toevoegen</button>${invitesLocked() ? "" : delBtn("households", h.id)}</div>
      </article>`;
    }).join("")}</div>`;
  }

  function viewInvites(){
    const hs = S.households, answered = hs.filter(h => h.rsvp_op).length;
    const people = S.guests.filter(g => g.gezin && !isCouple(g));
    const n = s => people.filter(g => (g.status || "open") === s).length;
    const yes = people.filter(g => g.status === "ja");
    const hg = h => yes.filter(g => g.diner && g.hoofdgerecht === h).length;
    const loose = S.guests.filter(g => !g.gezin && !isCouple(g)).sort((a,b) => guestRank(a) - guestRank(b));
    const chip = (k, l, c) => `<button class="chip-btn" data-ifilter="${k}" aria-pressed="${FI.filter === k}">${l} ${c}</button>`;
    const field = ([k, label, type, ph]) => `<label${type === "textarea" ? ' style="grid-column:1 / -1"' : ""}>${esc(label)}${type === "textarea"
      ? `<textarea id="set-${k}" data-setting="${k}" rows="3" placeholder="${esc(ph)}"${dis()}>${esc(S.settings[k] || "")}</textarea>`
      : `<input id="set-${k}" data-setting="${k}" type="${type}" placeholder="${esc(ph)}" value="${esc(S.settings[k] || "")}"${dis()}>`}</label>`;
    return `
      <div class="panel-head"><h2>Uitnodigingen</h2><span class="meta">${answered} van ${hs.length} gezinnen hebben geantwoord</span></div>
      ${lockBar()}
      <form class="add" data-add="households">
        <label class="grow">Naam op de uitnodiging<input id="h-naam" name="naam" required placeholder="bv. Familie Peeters"${dis()}></label>
        <button class="btn" type="submit"${dis()}>Gezin toevoegen</button>
      </form>
      <div class="inv-stats">
        <span><b>${n("ja")}</b> komen</span><span><b>${n("nee")}</b> komen niet</span><span><b>${n("open")}</b> nog geen antwoord</span>
        <span>Diner: <b>${yes.filter(g => g.diner).length}</b> (vlees ${hg("vlees")} · vis ${hg("vis")} · vegetarisch ${hg("vegetarisch")})</span>
        <span><b>${yes.filter(g => (g.dieet || "").trim()).length}</b> met allergie of dieet</span>
        <span><b>${hs.filter(hasAddr).length}</b> van ${hs.length} adressen</span>
      </div>
      <div class="qr-all">
        <div class="qr" aria-hidden="true">${qrSvg(rsvpBase())}</div>
        <div class="txt">
          <b>Eén QR-code voor alle uitnodigingen</b>
          <span class="meta">Gasten scannen deze code en vullen daarna de code van 6 cijfers van hun gezin in (staat bij elk gezin hieronder).${S.settings.site_url ? "" : " Vul eerst het webadres van de app in: de QR-code verandert mee."}</span>
          <code>${esc(rsvpBase())}</code>
          <div class="inv-acts"><button class="chip-btn" data-qr-dl>QR downloaden (SVG)</button><button class="chip-btn" data-copy="${esc(rsvpBase())}">Link kopiëren</button></div>
        </div>

  let lockConfirm = false;

  function download(name, blob){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;

  const qrFile = () => `<?xml version="1.0" encoding="UTF-8"?>\n` + qrSvg(rsvpBase(), 4).replace("<svg ", '<svg width="1000" height="1000" ');
  function linksCsv(){
    const rows = [["Gezin", "Code", "Aantal personen", "Gasten", "Straat", "Postcode", "Gemeente", "Land", "Antwoordpagina"]];
    [...S.households].sort((a,b) => (a.created||0) - (b.created||0)).forEach(h => {
      const ms = S.guests.filter(g => g.gezin === h.id).sort(memberOrder);
      rows.push([h.naam, fmtCode(h.code), ms.length, ms.map(gname).join(", "), h.adres_straat || "", h.adres_postcode || "", h.adres_gemeente || "", h.adres_land || "", rsvpBase()]);

  function copyText(t, what){
    what = what || "Link";

  function invitesClick(e){
    const t = e.target;
    if(t.closest("[data-lock-ask]")){ e.preventDefault(); lockConfirm = true; renderTab(); const b = main.querySelector("[data-lock-yes]"); if(b) b.focus(); return true; }
    if(t.closest("[data-lock-no]")){ lockConfirm = false; renderTab(); return true; }
    if(t.closest("[data-lock-yes]")){
      lockConfirm = false;
      const d = new Date(), p = n => String(n).padStart(2, "0");
      saveSettings({ uitnodigingen_verstuurd: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` });
      toast("Vergrendeld: de codes liggen vast"); renderTab(); return true;
    }
    const f = t.closest("[data-ifilter]"); if(f){ FI.filter = f.dataset.ifilter; renderTab(); return true; }
    const fa = t.closest("[data-iaddr]"); if(fa){ FI.addr = FI.addr === fa.dataset.iaddr ? "" : fa.dataset.iaddr; renderTab(); return true; }
    const ab = t.closest("[data-addr]"); if(ab){ J.h = null; A.h = ab.dataset.addr; renderAddrSheet(); const i = document.getElementById("addr-straat"); if(i) i.focus(); return true; }
    const cp = t.closest("[data-copy]"); if(cp){ copyText(cp.dataset.copy, cp.dataset.copyWhat); return true; }
    if(t.closest("[data-qr-dl]")){ download("QR-code uitnodiging.svg", new Blob([qrFile()], { type: "image/svg+xml" })); return true; }
    if(t.closest("[data-links-csv]")){ download("Uitnodigingen - codes.csv", new Blob([linksCsv()], { type: "text/csv;charset=utf-8" })); return true; }
    const sp = t.closest("[data-split]");
    if(sp){
      const g = S.guests.find(x => x.id === sp.dataset.split), old = g && g.gezin;
      if(!g) return true;
      // de +1 van deze gast gaat mee uit het gezin
      [g, ...plusOneOf(g)].forEach(x => write("guests", x.id, { gezin: "", gezin_volgorde: "" }));
      if(old) renameHousehold(old);
      toast("Uit het gezin gehaald"); return true;
    }
    const jo = t.closest("[data-join-open]"); if(jo){ J.h = jo.dataset.joinOpen; J.q = ""; renderSheet(); const i = document.getElementById("join-q"); if(i) i.focus(); return true; }
    const nh = t.closest("[data-newh]");
    if(nh){
      const g = S.guests.find(x => x.id === nh.dataset.newh); if(!g) return true;
      const group = g.optioneel ? [g] : [g, ...plusOneOf(g)];
      const p = add("households", { naam: autoHouseholdName(group) || gname(g), code: newCode(), notitie: "", rsvp_op: "", rsvp_bericht: "" });
      if(p) p.then(ref => { if(ref && ref.id) group.forEach(x => write("guests", x.id, { gezin: ref.id, gezin_volgorde: "" })); });
      return true;
    }
    return false;
  }

  // ---------- render ----------
  function autosize(root){ (root || main).querySelectorAll("textarea.auto").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }); }
  function renderTab(){
    if(S.dbOk === null){ main.innerHTML = `<div class="empty">Gegevens laden…</div>`; return; }
    const t = currentTab();
    main.innerHTML = t === "gasten" ? viewGuests() : t === "budget" ? viewBudget() : t === "taken" ? viewTasks() : t === "tafels" ? viewTables() : t === "vragen" ? viewQuestions() : t === "opvolging" ? viewOrders() : t === "menu" ? viewMenu() : t === "uitnodigingen" ? viewInvites() : viewInfo();
    const form = main.querySelector("form.add"), head = main.querySelector(".panel-head");
    if(form && head) head.after(form);
    const ag = main.querySelector(".agenda"); if(ag && head) head.after(ag);
    const lb = main.querySelector(".lockbar"); if(lb && head) head.after(lb);
    autosize();
  }
  const isSearch = el => el && (el.id === "g-search" || el.id === "i-search");
  function isEditing(){ const a = document.activeElement; return a && main.contains(a) && !isSearch(a) && a.matches("input:not([type=checkbox]),select,textarea"); }
  function renderAll(force){
    renderSummary();
    renderSheet(document.activeElement && (document.activeElement.id === "sheet-q" || document.activeElement.id === "join-q"));
    if(drag){ pending = true; return; }
    if(!force && (isEditing() || pressing || confirmDone !== null)){ pending = true; return; }
    pending = false;
    if(!force && isSearch(document.activeElement)){
      const gl = document.getElementById("guest-list"); if(gl){ gl.innerHTML = guestRows(); return; }
      const il = document.getElementById("inv-list"); if(il){ il.innerHTML = inviteCards(); return; }
    }
    renderTab();
  }

  // ---------- slepen (budget en taken) ----------
  function budgetOrd(b){ return typeof b.volgorde === "number" ? b.volgorde : (b.created || 0); }
  function sortTasks(list){
    const mk = t => t.deadline ? t.deadline.slice(0,7) : "9999";
    const vo = t => typeof t.volgorde === "number" ? t.volgorde : 1e9;
    return list.sort((a,b) => {
      if(!!a.done !== !!b.done) return a.done ? 1 : -1;
      if(mk(a) !== mk(b)) return mk(a) < mk(b) ? -1 : 1;
      if(vo(a) !== vo(b)) return vo(a) - vo(b);
      const da = a.deadline || "9999", dbb = b.deadline || "9999";
      return da < dbb ? -1 : da > dbb ? 1 : (a.created||0)-(b.created||0);
    });
  }
  const lastDayOf = ym => { const [y,m] = ym.split("-").map(Number); return `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2,"0")}`; };
  const monthLabel = ym => { const [y,m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleDateString("nl-BE",{month:"long",year:"numeric"}); };
  let drag = null, confirmDone = null, CF = null, pressing = false;
  function saveOrder(col, ids){
    ids.forEach((id, i) => { const x = S[col].find(y => y.id === id); if(x && x.volgorde !== i + 1) write(col, id, { volgorde: i + 1 }); });
  }
  function saveBudgetOrder(ids){ saveOrder("budget", ids); }
  // Gast verplaatsen: enkel zijn eigen kolom "volgorde" verandert (midden tussen de buren), de andere gasten blijven ongemoeid.
  function rankAfter(prevId, selfId){
    const list = guestsSorted().filter(g => g.id !== selfId), i = list.findIndex(g => g.id === prevId);
    if(i < 0) return null;
    const a = guestRank(list[i]), b = list[i + 1] ? guestRank(list[i + 1]) : a + 2;
    return a < b ? (a + b) / 2 : null;
  }
  function rankBefore(nextId, selfId){
    const list = guestsSorted().filter(g => g.id !== selfId), i = list.findIndex(g => g.id === nextId);
    if(i < 0) return null;
    const b = guestRank(list[i]), a = i > 0 ? guestRank(list[i - 1]) : b - 2;
    return a < b ? (a + b) / 2 : null;
  }
  function placeGuest(id, prevId, nextId){
    let r = prevId ? rankAfter(prevId, id) : nextId ? rankBefore(nextId, id) : null;
    if(r === null && (prevId || nextId)){
      // Gelijke nummers: hele lijst één keer hernummeren en dan opnieuw plaatsen.
      const list = guestsSorted().filter(g => g.id !== id);
      let at = prevId ? list.findIndex(g => g.id === prevId) + 1 : list.findIndex(g => g.id === nextId);
      const g = S.guests.find(x => x.id === id); list.splice(Math.max(0, at), 0, g);
      list.forEach((x, i) => { if(guestRank(x) !== i + 1 || x.volgorde === "" || x.volgorde == null) write("guests", x.id, { volgorde: i + 1 }); });
      return;
    }
    if(r !== null) write("guests", id, { volgorde: r });
  }
  main.addEventListener("pointerdown", e => {
    const h = e.target.closest("[data-handle]"); if(!h || h.disabled || !S.canWrite || e.button > 0) return;
    const item = h.closest("[data-row-id]"); if(!item) return;
    e.preventDefault();
    const box = item.parentNode;
    drag = { kind: h.dataset.kind || "budget", item, box, startIds: [...box.querySelectorAll("[data-row-id]")].map(r => r.dataset.rowId) };
    item.classList.add("dragging"); document.body.classList.add("is-dragging");
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
  });
  main.addEventListener("pointermove", e => {
    if(!drag) return;
    e.preventDefault();
    if(e.clientY < 70) window.scrollBy(0, -14); else if(e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const over = el && el.closest("[data-row-id], .group-h");
    if(!over || over === drag.item || over.parentNode !== drag.box) return;
    const r = over.getBoundingClientRect(), above = e.clientY < r.top + r.height / 2;
    if(over.classList.contains("group-h")){
      if(over.dataset.month === "__done") return;
      if(above){ if(!over.previousElementSibling) return; drag.box.insertBefore(drag.item, over); }
      else drag.box.insertBefore(drag.item, over.nextSibling);
      return;
    }
    drag.box.insertBefore(drag.item, above ? over : over.nextSibling);
  });
  function endDrag(){
    if(!drag) return;
    const d = drag; drag = null;
    d.item.classList.remove("dragging"); document.body.classList.remove("is-dragging");
    const ids = [...d.box.querySelectorAll("[data-row-id]")].map(r => r.dataset.rowId);
    const changed = ids.join() !== d.startIds.join();
    if(d.kind === "task"){
      let month = null, newMonth = null;
      for(const el of d.box.children){ if(el.classList.contains("group-h")) month = el.dataset.month; else if(el === d.item){ newMonth = month; break; } }
      const t = S.tasks.find(x => x.id === d.item.dataset.rowId);
      let moved = false;
      if(t && newMonth !== null && newMonth !== "__done"){
        const cur = t.deadline ? t.deadline.slice(0,7) : "";
        if(newMonth !== cur){ write("tasks", t.id, { deadline: newMonth ? lastDayOf(newMonth) : "" }); moved = true; toast(newMonth ? `Verplaatst naar ${monthLabel(newMonth)}` : "Uiterste datum verwijderd"); }
      }
      if(changed || moved){ saveOrder("tasks", ids); if(!moved) toast("Volgorde bewaard"); }
    } else if(d.kind === "guest"){
      if(changed){
        const rows = [...d.box.querySelectorAll("[data-row-id]")], i = rows.indexOf(d.item);
        placeGuest(d.item.dataset.rowId, rows[i - 1] ? rows[i - 1].dataset.rowId : null, rows[i + 1] ? rows[i + 1].dataset.rowId : null);
        toast("Volgorde bewaard");
      }
    } else if(d.kind === "member"){
      if(changed){ const g = S.guests.find(x => x.id === d.item.dataset.rowId); if(g && g.gezin) saveMemberOrder(g.gezin, ids); toast("Volgorde in het gezin bewaard"); }
    } else if(changed){ saveOrder("budget", ids); toast("Volgorde bewaard"); }
    if(pending) renderAll();
  }
  main.addEventListener("pointerup", endDrag);
  main.addEventListener("pointercancel", endDrag);
  main.addEventListener("keydown", e => {
    const h = e.target.closest("[data-handle]"); if(!h || !S.canWrite || h.dataset.kind === "task") return;
    if(e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    if(h.dataset.kind === "guest"){
      const tr = h.closest("tr"), id = h.dataset.handle;
      const rows = [...tr.parentNode.querySelectorAll("[data-row-id]")], i = rows.indexOf(tr), up = e.key === "ArrowUp";
      const j = up ? i - 1 : i + 1; if(j < 0 || j >= rows.length) return;
      const rid = k => rows[k] ? rows[k].dataset.rowId : null;
      if(up) placeGuest(id, rid(i - 2), rid(i - 1)); else placeGuest(id, rid(i + 1), rid(i + 2));
      const nh = main.querySelector(`[data-handle="${CSS.escape(id)}"]`); if(nh) nh.focus();
      return;
    }
    if(h.dataset.kind === "member"){
      const li = h.closest("li"), sib = e.key === "ArrowUp" ? li.previousElementSibling : li.nextElementSibling;
      if(!sib) return;
      li.parentNode.insertBefore(li, e.key === "ArrowUp" ? sib : sib.nextSibling);
      h.focus();
      const g = S.guests.find(x => x.id === h.dataset.handle);
      if(g && g.gezin) saveMemberOrder(g.gezin, [...li.parentNode.querySelectorAll("[data-row-id]")].map(r => r.dataset.rowId));
      return;
    }
    const ids = [...S.budget].sort((a,b) => budgetOrd(a) - budgetOrd(b)).map(b => b.id);
    const i = ids.indexOf(h.dataset.handle), j = e.key === "ArrowUp" ? i - 1 : i + 1;
    if(i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    const tr = h.closest("tr"), sib = e.key === "ArrowUp" ? tr.previousElementSibling : tr.nextElementSibling;
    if(sib) tr.parentNode.insertBefore(tr, e.key === "ArrowUp" ? sib : sib.nextSibling);
    h.focus();
    saveBudgetOrder(ids);
  });

  // ---------- events ----------
  main.addEventListener("toggle", e => { const d = e.target; if(d && d.matches && d.matches(".ag-ev")) AG.open = d.open ? d.dataset.agId : (AG.open === d.dataset.agId ? null : AG.open); }, true);
  main.addEventListener("focusout", () => { if(pending) setTimeout(() => { if(!isEditing() && !pressing) renderAll(); }, 0); });
  // Tijdens een tik (vinger neer, nog niet los) nooit de pagina herbouwen, anders gaat de tik verloren.
  main.addEventListener("pointerdown", () => { pressing = true; }, true);
  const release = () => { if(!pressing) return; pressing = false; if(pending) setTimeout(() => { if(!isEditing() && !pressing && !drag) renderAll(); }, 80); };
  document.addEventListener("pointerup", release, true);
  document.addEventListener("pointercancel", release, true);
  window.addEventListener("hashchange", () => { confirmDone = null; CF = null; if(A.h){ A.h = null; sheet.innerHTML = ""; } renderAll(true); });

  main.addEventListener("input", e => {
    if(isSearch(e.target)){ F.q = e.target.value; document.getElementById("guest-list").innerHTML = guestRows(); }
    if(e.target.id === "i-search"){ FI.q = e.target.value; const il = document.getElementById("inv-list"); if(il) il.innerHTML = inviteCards(); }
    if(e.target.matches("textarea.auto")){ e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; }
    if(CF && e.target.id === "ovl-" + CF.id) CF.label = e.target.value;
    if(CF && e.target.id === "ovi-" + CF.id) CF.info = e.target.value;
  });
  main.addEventListener("change", e => {
    const el = e.target;
    if(el.id === "t-cat-filter"){ F.taskCat = el.value; renderTab(); return; }
    if(el.id === "g-rel-filter"){ F.rel = el.value; renderTab(); return; }
    if(el.id === "g-onder"){
      const a = S.guests.find(x => x.id === el.value), form = el.closest("form");
      if(a){ form.querySelector("#g-via").value = a.via || "louis"; if(RELATIES.slice(0,5).includes(a.relatie)) form.querySelector("#g-relatie").value = a.relatie; }
      const box = form.querySelector(".g-samen"); box.hidden = !(a && a.gezin);
      if(a && a.gezin){ const h = S.households.find(x => x.id === a.gezin); box.querySelector("span").lastChild.textContent = ` Op dezelfde uitnodiging${h ? " (" + h.naam + ")" : ""}`; }
      return;
    }
    if(el.id === "q-lev-filter"){ FQ.lev = el.value; renderTab(); return; }
    if(el.dataset.setting){ saveSettings({ [el.dataset.setting]: el.value.trim() }); return; }
    if(el.dataset.seat !== undefined){ if(el.value) write("guests", el.value, { tafel: el.dataset.seat }); el.blur(); return; }
    const { col, id, f, t } = el.dataset; if(!col || !id || !f) return;
    if(col === "tasks" && f === "done" && el.checked){
      el.checked = false; confirmDone = id; renderTab();
      const b = main.querySelector("[data-confirm-done]"); if(b) b.focus();
      return;
    }
    let v = el.type === "checkbox" ? el.checked : el.value;
    if(t === "int") v = Math.max(1, parseInt(v,10) || 1);
    if(t === "money") v = parseMoney(v);
    if(f === "status") el.dataset.v = v;
    const patch = { [f]: v };
    if(col === "guests" && f === "kind" && v === true){ patch.diner = false; patch.hoofdgerecht = ""; }
    if(col === "orders" && f === "toegekomen") patch.toegekomen_op = v ? todayIso() : "";
    if(col === "guests" && f === "status" && v === "nee"){ patch.tafel = ""; patch.plaats = null; patch.definitief = false; }
    write(col, id, patch);
    if(el.tagName === "SELECT" || el.type === "checkbox") el.blur();
  });
  main.addEventListener("click", e => {
    const bb = e.target.closest("[data-bbasis]"); if(bb){ BG.basis = bb.dataset.bbasis; renderTab(); return; }
    const agn = e.target.closest("[data-agnav]"); if(agn){ const v = Number(agn.dataset.agnav); AG.start = v === 0 ? 0 : AG.start + v * WEEKS; renderTab(); return; }
    if(e.target.closest("[data-hide-budget]")){ setHideBudget(true); return; }
    if(e.target.closest("[data-show-budget]")){ setHideBudget(false); return; }
    const ddel = e.target.closest("[data-drank-del]"); if(ddel){ remove("menu", ddel.dataset.drankDel); return; }
    const vdel = e.target.closest("[data-voorstel-del]"); if(vdel){ removeVoorstel(vdel.dataset.voorstelDel); return; }
    const dsh = e.target.closest("[data-dish]"); if(dsh){ toggleDish(dsh.dataset.dish, dsh.dataset.gerecht, dsh.dataset.groep); return; }
    const mt = e.target.closest("[data-mtemp]"); if(mt){ const [k, v] = mt.dataset.mtemp.split(":"); FM[k] = v; renderTab(); return; }
    if(e.target.closest("[data-menu-copy]")){ const txt = menuText(); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Menu gekopieerd. Plak het in een mail aan de cateraar."), () => { window.prompt("Kopieer het menu:", txt); }); return; }
    const ov = e.target.closest("[data-oview]"); if(ov){ FO.view = ov.dataset.oview; renderTab(); return; }
    const qv = e.target.closest("[data-qview]"); if(qv){ FQ.view = qv.dataset.qview; renderTab(); return; }
    if(e.target.closest("[data-ov-edit]")){ OV.edit = true; renderTab(); return; }
    if(e.target.closest("[data-ov-done]")){ OV.edit = false; renderTab(); return; }
    const spot = e.target.closest("[data-spot]");
    if(spot){ onSpot(spot.dataset.spot); return; }
    const pg = e.target.closest("[data-place-guest]");
    if(pg){ T.placing = T.placing === pg.dataset.placeGuest ? null : pg.dataset.placeGuest; T.sel = null; T.moving = null; refreshTables(); return; }
    const cap = e.target.closest("[data-cap]");
    if(cap){
      const t = S.tables.find(x => x.id === cap.dataset.cap); if(!t) return;
      const n = Number(t.plaatsen) || 0, d = Number(cap.dataset.d);
      if(d < 0){
        if(n <= 1) return;
        const g = seatMap().map[t.id + ":" + (n - 1)];
        if(g){ toast(`De laatste plaats is bezet door ${firstName(g)}. Maak ze eerst vrij.`); return; }
      }
      write("tables", t.id, { plaatsen: Math.min(120, Math.max(1, n + d)) });
      return;
    }
    if(invitesClick(e)) return;
    const fb = e.target.closest("[data-fgrp]");
    if(fb){ F[fb.dataset.fgrp] = fb.dataset.fval; renderTab(); return; }
    if(e.target.closest("[data-burg]")){ F.burg = !F.burg; renderTab(); return; }
    const cd = e.target.closest("[data-confirm-done]");
    if(cd){ const id = cd.dataset.confirmDone; confirmDone = null;
      const patch = { done: true }, li = document.getElementById("ovl-" + id), ii = document.getElementById("ovi-" + id);
      const tk = S.tasks.find(x => x.id === id);
      if(tk && tk.categorie !== CAT_CHECK){
        const draft = CF && CF.id === id ? CF : null;
        patch.overzicht = String(draft ? draft.label : li ? li.value : "").trim();
        patch.overzicht_info = String(draft ? draft.info : ii ? ii.value : "").trim();
      }
      CF = null;
      write("tasks", id, patch); const wasCheck = (S.tasks.find(x => x.id === id) || {}).categorie === CAT_CHECK;
      toast(patch.overzicht ? `Gedaan · staat nu in het Overzicht als ${patch.overzicht}` : wasCheck ? "Gecheckt" : "Gemarkeerd als gedaan"); renderTab(); return; }
    if(e.target.closest("[data-confirm-cancel]")){ confirmDone = null; CF = null; renderTab(); return; }
    const tv = e.target.closest("[data-tview]");
    if(tv){ F.taskView = tv.dataset.tview; renderTab(); return; }
    const un = e.target.closest("[data-unseat]");
    if(un){ write("guests", un.dataset.unseat, { tafel: "" }); return; }
    const del = e.target.closest("[data-del]");
    if(del){
      if(!del.classList.contains("armed")){
        del.classList.add("armed"); del.textContent = "Zeker?";
        setTimeout(() => { if(del.isConnected){ del.classList.remove("armed"); del.textContent = "Verwijder"; } }, 3000);
        return;
      }
      const col = del.dataset.del, id = del.dataset.id;
      if(col === "households" && invitesLocked()){ toast("De uitnodigingen zijn verstuurd: gezinnen kunnen niet meer verwijderd worden."); return; }
      if(col === "households") S.guests.filter(g => g.gezin === id).forEach(g => write("guests", g.id, { gezin: "" }));
      if(col === "tables") S.guests.filter(g => g.tafel === id).forEach(g => write("guests", g.id, { tafel: "", plaats: null, definitief: false }));
      remove(col, id);
    }
  });
  main.addEventListener("submit", e => {
    e.preventDefault();
    const form = e.target, kind = form.dataset.add, fd = new FormData(form);
    if(form.hasAttribute("data-agenda")){
      const datum = String(fd.get("datum") || "").trim(), titel = String(fd.get("titel") || "").trim(); if(!datum || !titel) return;
      if(db && db.has && !db.has("events")){ toast("Werk eerst het script (Code.gs) bij, dan kan je dit bewaren."); return; }
      add("events", { datum, uur: String(fd.get("uur") || "").trim(), titel, waar: String(fd.get("waar") || "").trim(), notitie: "" });
      const [y,m,d] = datum.split("-").map(Number), wk = Math.floor((mondayOf(new Date(y, m-1, d)) - mondayOf(today())) / (7 * 864e5));
      if(wk < AG.start || wk >= AG.start + WEEKS) AG.start = wk;
      toast(`Afspraak toegevoegd op ${dayLabel(datum)}`);
      form.querySelectorAll("input").forEach(i => i.blur()); renderAll(); return; }
    if(form.dataset.drank){ const t = String(fd.get("tekst") || "").trim(); if(!t) return;
      if(db && db.has && !db.has("menu")){ toast("Werk eerst het script (Code.gs) bij, dan kan je dit bewaren."); return; }
      add("menu", { gang: "drank", soort: "drank", groep: form.dataset.drank, gerecht: t, opmerking: "" }); form.reset(); const i = form.querySelector("input"); if(i) i.blur(); renderAll(); return; }
    if(form.dataset.voorstel){ const t = String(fd.get("tekst") || "").trim(); if(!t) return; addVoorstel(form.dataset.voorstel, t); form.reset(); const i = form.querySelector("input"); if(i) i.blur(); renderAll(); return; }
    const txt = k => String(fd.get(k) || "").trim();
    if(kind === "guests"){ if(!txt("voornaam")) return;
      const anchor = S.guests.find(x => x.id === txt("onder")), hid = anchor && anchor.gezin && fd.get("samen") ? anchor.gezin : "";
      add("guests", { nr: Math.max(0, ...S.guests.map(g => Number(g.nr)||0)) + 1, ...(anchor ? { volgorde: rankAfter(anchor.id, null) } : {}), ...(hid ? { gezin: hid, gezin_volgorde: "" } : {}), voornaam: txt("voornaam"), achternaam: txt("achternaam"), via: txt("via")||"louis", relatie: txt("relatie")||"Vrienden",
        email:"", telefoon:"", adres:"", burgerlijk:false, status:"open", ceremonie:null, receptie:null, diner:null, hoofdgerecht:"", dieet:"", opmerking:"", optioneel:false, tafel:"" });
      if(hid){ const n = renameHousehold(hid); toast(`${txt("voornaam")} toegevoegd onder ${gname(anchor)}, op de uitnodiging ${n}`); }
      else if(anchor) toast(`${txt("voornaam")} toegevoegd onder ${gname(anchor)}`);
      const box = form.querySelector(".g-samen"); if(box) box.hidden = true; }
    if(kind === "budget"){ if(!txt("post")) return; add("budget", { volgorde: Math.max(0, ...S.budget.map(budgetOrd).filter(n => n < 1e6)) + 1, post: txt("post"), geraamd: parseMoney(fd.get("geraamd")||0), werkelijk: 0, vastgelegd:false, eigen:false, opmerking:"" }); }
    if(kind === "orders"){ if(!txt("wat")) return;
      add("orders", { wat: txt("wat"), bij: txt("bij"), besteld_op: txt("besteld_op"), toegekomen: false, toegekomen_op: "", opmerking: "" });
      form.reset(); const d = form.querySelector('[name="besteld_op"]'); if(d) d.value = todayIso(); const w = form.querySelector('[name="wat"]'); if(w) w.focus(); return; }
    if(kind === "questions"){ if(!txt("vraag")) return; const lev = txt("leverancier") || "Algemeen";
      FQ.lastLev = lev;
      add("questions", { leverancier: lev, vraag: txt("vraag"), antwoord: "", beantwoord: false, volgorde: "" }); const v = form.querySelector('[name="vraag"]'); if(v){ v.value = ""; v.focus(); } return; }
    if(kind === "check"){ if(!txt("titel")) return; add("tasks", { titel: txt("titel"), categorie: CAT_CHECK, deadline: "", wie: "samen", done:false, leverancier:"", bedrag:0, opmerking:"", prioriteit:"" }); form.reset(); return; }
    if(kind === "tasks"){ if(!txt("titel")) return; add("tasks", { titel: txt("titel"), categorie: txt("categorie"), deadline: txt("deadline"), wie: txt("wie")||"samen", done:false, leverancier:"", bedrag:0, opmerking:"", prioriteit:"" }); }
    if(kind === "tables"){ if(!txt("naam")) return; add("tables", { naam: txt("naam"), plaatsen: Math.max(1, parseInt(fd.get("plaatsen"),10)||10) }); }
    if(kind === "households"){ if(!txt("naam")) return; add("households", { naam: txt("naam"), code: newCode(), notitie: "", rsvp_op: "", rsvp_bericht: "" }); }
    if(kind === "info"){ if(!txt("sectie") || !txt("label")) return; add("info", { sectie: txt("sectie"), label: txt("label"), waarde: txt("waarde"), volgorde: 1000 + S.info.length }); }
    const first = form.querySelector("input[required]"); form.reset(); if(first) first.focus();
  });

  // ---------- start: aanmelden met de toegangscode ----------
  const PIN_KEY = "tp_pin";
  const loginEl = document.getElementById("login");
  const syncEl = document.getElementById("sync-state");
  const setSync = t => { syncEl.textContent = t; };
  function storedPin(){ try{ return localStorage.getItem(PIN_KEY) || ""; }catch(_){ return ""; } }
  function savePin(p){ try{ if(p) localStorage.setItem(PIN_KEY, p); else localStorage.removeItem(PIN_KEY); }catch(_){} }
  function showLogin(msg){
    loginEl.hidden = false;
    document.getElementById("login-msg").textContent = msg || "";
    setTimeout(() => { const i = document.getElementById("pin"); if(i) i.focus(); }, 50);
  }
  async function start(pin){
    const btn = loginEl.querySelector("button[type=submit]");
    btn.disabled = true; document.getElementById("login-msg").textContent = "Even geduld…";
    let res;
    try{ res = await TPApi.post(TPApi.apiUrl(), { action: "login", pin }); }
    catch(e){ btn.disabled = false; showLogin(e && e.code === "not_configured" ? e.message : "Geen verbinding met de Google Sheet. Controleer je internet en probeer opnieuw."); return; }
    btn.disabled = false;
    if(!res.ok){
      savePin("");
      showLogin(res.error === "unauthorized" ? "Die toegangscode klopt niet (na 20 foute pogingen wacht je 10 minuten)." : "Er ging iets mis: " + (res.message || res.error));
      return;
    }
    savePin(pin);
    loginEl.hidden = true;
    setSync("Laden…");
    if(!(window.TPApi && TPApi.version >= 2)) showNotice("Er is een nieuwe versie van de app. Herlaad de pagina (of sluit de app en open ze opnieuw).");
    db = createApiDb({
      pin,
      onUnauthorized: () => { savePin(""); location.reload(); },
      onSync: d => setSync("Bijgewerkt om " + d.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" })),
      onBusy: busy => { if(busy) setSync("Opslaan…"); },
    });
    const map = snap => snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    COLS.forEach(col => db.collection(col).onSnapshot(snap => { S.dbOk = true; S[col] = map(snap); renderAll(); }));
    db.doc("meta/settings").onSnapshot(snap => { S.settings = Object.assign({}, snap.data()); renderAll(); });
    try{ await db.load(); }
    catch(e){ showNotice("De gegevens konden niet geladen worden. Controleer je internetverbinding en herlaad de app."); setSync("Niet verbonden"); }
    db.startPolling(20000);
    renderAll(true);
  }
  document.getElementById("login-form").addEventListener("submit", e => {
    e.preventDefault();
    const p = document.getElementById("pin").value.trim();
    if(p) start(p);
  });
  document.getElementById("logout").addEventListener("click", () => { savePin(""); location.reload(); });
  renderSummary();
  const firstPin = storedPin();
  if(firstPin) start(firstPin); else showLogin();
})();
</script>
</body>
</html>
