    const ids = [...S.budget].sort((a,b) => budgetOrd(a) - budgetOrd(b)).map(b => b.id);
    const i = ids.indexOf(h.dataset.handle), j = e.key === "ArrowUp" ? i - 1 : i + 1;
    if(i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    const tr = h.closest("tr"), sib = e.key === "ArrowUp" ? tr.previousElementSibling : tr.nextElementSibling;
    if(sib) tr.parentNode.insertBefore(tr, e.key === "ArrowUp" ? sib : sib.nextSibling);
    h.focus();
    saveBudgetOrder(ids);
  });

  // ---------- events ----------
  main.addEventListener("focusout", () => { if(pending) setTimeout(() => { if(!isEditing()) renderAll(); }, 0); });
  window.addEventListener("hashchange", () => renderAll(true));

  main.addEventListener("input", e => {
    if(isSearch(e.target)){ F.q = e.target.value; document.getElementById("guest-list").innerHTML = guestRows(); }
    if(e.target.id === "i-search"){ FI.q = e.target.value; const il = document.getElementById("inv-list"); if(il) il.innerHTML = inviteCards(); }
    if(e.target.matches("textarea.auto")){ e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; }
  });
  main.addEventListener("change", e => {
    const el = e.target;
    if(el.id === "t-cat-filter"){ F.taskCat = el.value; renderTab(); return; }
    if(el.dataset.setting){ saveSettings({ [el.dataset.setting]: el.value.trim() }); return; }
    if(el.dataset.seat !== undefined){ if(el.value) write("guests", el.value, { tafel: el.dataset.seat }); el.blur(); return; }
    const { col, id, f, t } = el.dataset; if(!col || !id || !f) return;
    if(col === "tasks" && f === "done" && el.checked){
      el.checked = false; confirmDone = id; renderTab();
      const b = main.querySelector("[data-confirm-done]"); if(b) b.focus();
      return;
    }
    let v = el.type === "checkbox" ? el.checked : el.value;
    if(t === "int") v = Math.max(1, parseInt(v,10) || 1);
    if(t === "money") v = parseMoney(v);
    if(f === "status") el.dataset.v = v;
    const patch = { [f]: v };
    if(col === "guests" && f === "kind" && v === true){ patch.diner = false; patch.hoofdgerecht = ""; }
    if(col === "guests" && f === "status" && v === "nee"){ patch.tafel = ""; patch.plaats = null; patch.definitief = false; }
    write(col, id, patch);
    if(el.tagName === "SELECT" || el.type === "checkbox") el.blur();
  });
  main.addEventListener("click", e => {
    const spot = e.target.closest("[data-spot]");
    if(spot){ onSpot(spot.dataset.spot); return; }
    const pg = e.target.closest("[data-place-guest]");
    if(pg){ T.placing = T.placing === pg.dataset.placeGuest ? null : pg.dataset.placeGuest; T.sel = null; T.moving = null; refreshTables(); return; }
    const cap = e.target.closest("[data-cap]");
    if(cap){
      const t = S.tables.find(x => x.id === cap.dataset.cap); if(!t) return;
      const n = Number(t.plaatsen) || 0, d = Number(cap.dataset.d);
      if(d < 0){
        if(n <= 1) return;
        const g = seatMap().map[t.id + ":" + (n - 1)];
        if(g){ toast(`De laatste plaats is bezet door ${firstName(g)}. Maak ze eerst vrij.`); return; }
      }
      write("tables", t.id, { plaatsen: Math.min(120, Math.max(1, n + d)) });
      return;
    }
    if(invitesClick(e)) return;
    const fb = e.target.closest("[data-fgrp]");
    if(fb){ F[fb.dataset.fgrp] = fb.dataset.fval; renderTab(); return; }
    if(e.target.closest("[data-burg]")){ F.burg = !F.burg; renderTab(); return; }
    const cd = e.target.closest("[data-confirm-done]");
    if(cd){ const id = cd.dataset.confirmDone; confirmDone = null; write("tasks", id, { done: true }); toast("Gemarkeerd als gedaan"); renderTab(); return; }
    if(e.target.closest("[data-confirm-cancel]")){ confirmDone = null; renderTab(); return; }
    const tv = e.target.closest("[data-tview]");
    if(tv){ F.taskView = tv.dataset.tview; renderTab(); return; }
    const un = e.target.closest("[data-unseat]");
    if(un){ write("guests", un.dataset.unseat, { tafel: "" }); return; }
    const del = e.target.closest("[data-del]");
    if(del){
      if(!del.classList.contains("armed")){
        del.classList.add("armed"); del.textContent = "Zeker?";
        setTimeout(() => { if(del.isConnected){ del.classList.remove("armed"); del.textContent = "Verwijder"; } }, 3000);
        return;
      }
      const col = del.dataset.del, id = del.dataset.id;
      if(col === "households") S.guests.filter(g => g.gezin === id).forEach(g => write("guests", g.id, { gezin: "" }));
      if(col === "tables") S.guests.filter(g => g.tafel === id).forEach(g => write("guests", g.id, { tafel: "", plaats: null, definitief: false }));
      remove(col, id);
    }
  });
  main.addEventListener("submit", e => {
    e.preventDefault();
    const form = e.target, kind = form.dataset.add, fd = new FormData(form);
    const txt = k => String(fd.get(k) || "").trim();
    if(kind === "guests"){ if(!txt("voornaam")) return;
      add("guests", { nr: Math.max(0, ...S.guests.map(g => Number(g.nr)||0)) + 1, voornaam: txt("voornaam"), achternaam: txt("achternaam"), via: txt("via")||"louis", relatie: txt("relatie")||"Vrienden",
        email:"", telefoon:"", adres:"", burgerlijk:false, status:"open", ceremonie:null, receptie:null, diner:null, hoofdgerecht:"", dieet:"", opmerking:"", optioneel:false, tafel:"" }); }
    if(kind === "budget"){ if(!txt("post")) return; add("budget", { volgorde: Math.max(0, ...S.budget.map(budgetOrd).filter(n => n < 1e6)) + 1, post: txt("post"), geraamd: parseMoney(fd.get("geraamd")||0), werkelijk: 0, vastgelegd:false, opmerking:"" }); }
    if(kind === "tasks"){ if(!txt("titel")) return; add("tasks", { titel: txt("titel"), categorie: txt("categorie"), deadline: txt("deadline"), wie: txt("wie")||"samen", done:false, leverancier:"", bedrag:0, opmerking:"", prioriteit:"" }); }
    if(kind === "tables"){ if(!txt("naam")) return; add("tables", { naam: txt("naam"), plaatsen: Math.max(1, parseInt(fd.get("plaatsen"),10)||10) }); }
    if(kind === "households"){ if(!txt("naam")) return; add("households", { naam: txt("naam"), code: newCode(), notitie: "", rsvp_op: "", rsvp_bericht: "" }); }
    if(kind === "info"){ if(!txt("sectie") || !txt("label")) return; add("info", { sectie: txt("sectie"), label: txt("label"), waarde: txt("waarde"), volgorde: 1000 + S.info.length }); }
    const first = form.querySelector("input[required]"); form.reset(); if(first) first.focus();
  });
  document.getElementById("partner-input").addEventListener("change", e => saveSettings({ partner: e.target.value.trim() }));

  // ---------- start: aanmelden met de toegangscode ----------
  const PIN_KEY = "tp_pin";
  const loginEl = document.getElementById("login");
  const syncEl = document.getElementById("sync-state");
  const setSync = t => { syncEl.textContent = t; };
  function storedPin(){ try{ return localStorage.getItem(PIN_KEY) || ""; }catch(_){ return ""; } }
  function savePin(p){ try{ if(p) localStorage.setItem(PIN_KEY, p); else localStorage.removeItem(PIN_KEY); }catch(_){} }
  function showLogin(msg){
    loginEl.hidden = false;
    document.getElementById("login-msg").textContent = msg || "";
    setTimeout(() => { const i = document.getElementById("pin"); if(i) i.focus(); }, 50);
  }
  async function start(pin){
    const btn = loginEl.querySelector("button[type=submit]");
    btn.disabled = true; document.getElementById("login-msg").textContent = "Even geduld…";
    let res;
    try{ res = await TPApi.post(TPApi.apiUrl(), { action: "login", pin }); }
    catch(e){ btn.disabled = false; showLogin(e && e.code === "not_configured" ? e.message : "Geen verbinding met de Google Sheet. Controleer je internet en probeer opnieuw."); return; }
    btn.disabled = false;
    if(!res.ok){
      savePin("");
      showLogin(res.error === "unauthorized" ? "Die toegangscode klopt niet (na 20 foute pogingen wacht je 10 minuten)." : "Er ging iets mis: " + (res.message || res.error));
      return;
    }
    savePin(pin);
    loginEl.hidden = true;
    setSync("Laden…");
    db = createApiDb({
      pin,
      onUnauthorized: () => { savePin(""); location.reload(); },
      onSync: d => setSync("Bijgewerkt om " + d.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" })),
      onBusy: busy => { if(busy) setSync("Opslaan…"); },
    });
    const map = snap => snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    COLS.forEach(col => db.collection(col).onSnapshot(snap => { S.dbOk = true; S[col] = map(snap); renderAll(); }));
    db.doc("meta/settings").onSnapshot(snap => { S.settings = Object.assign({}, snap.data()); renderAll(); });
    try{ await db.load(); }
    catch(e){ showNotice("De gegevens konden niet geladen worden. Controleer je internetverbinding en herlaad de app."); setSync("Niet verbonden"); }
    db.startPolling(20000);
    renderAll(true);
  }
  document.getElementById("login-form").addEventListener("submit", e => {
    e.preventDefault();
    const p = document.getElementById("pin").value.trim();
    if(p) start(p);
  });
  document.getElementById("logout").addEventListener("click", () => { savePin(""); location.reload(); });
  renderSummary();
  const firstPin = storedPin();
  if(firstPin) start(firstPin); else showLogin();
})();
</script>
</body>
</html>
